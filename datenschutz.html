*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px;background:var(--bg)}
[tabindex="-1"]:focus{outline:none}   /* Sprungziele (ANKER_JS) bekommen Fokus, aber keinen Rahmen */
/* Hintergrund wie im Studio: 44-px-Raster mit Ausblend-Maske (Nutzer 16.11.); body als eigener Stapelkontext, damit das
   Raster (::before, z-index -1) über dem Grund und unter dem Inhalt liegt. 17.11. „cleaner“: Licht-Fleck oben entfernt. */
body{margin:0;isolation:isolate;background:var(--bg);
 color:var(--text);overflow-x:hidden;
 font:17px/1.55 'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background-image:linear-gradient(var(--raster) 1px,transparent 1px),linear-gradient(90deg,var(--raster) 1px,transparent 1px);background-size:44px 44px;
 -webkit-mask-image:radial-gradient(ellipse 120% 85% at 50% 0%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 120% 85% at 50% 0%,#000 25%,transparent 80%)}
@media (max-width:600px){body::before{display:none}}   /* Raster nur Desktop/Tablet – wie im Studio (Nutzer 15.11.) */
html[data-l="de"] [data-lang="en"],html[data-l="en"] [data-lang="de"]{display:none!important}
a{color:inherit}
img,svg{display:block}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--card);color:var(--text);padding:10px 14px;border-radius:10px;border:1px solid var(--line3)}
.skip:focus{top:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
@media (max-width:600px){.wrap{padding:0 20px}}

/* Karten wie im Studio (17.11.: ohne Maus-Licht – ruhige Fläche) */
.card{position:relative;background:var(--card);border:1px solid var(--cardline);border-radius:16px;box-shadow:var(--cardsh)}

/* Kopfzeile (wie Studio: Logo + Wortmarke, Reiter-Pille in der Mitte) */
.top{position:sticky;top:0;z-index:50;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.marke{display:flex;align-items:center;gap:11px;min-height:44px;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1}
.marke img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.marke b{color:var(--red);font-weight:700}
.hnav{display:flex;gap:4px;padding:4px;margin:0 auto;border:1px solid var(--line);border-radius:12px;background:var(--inner)}
.hnav a{font-size:14px;font-weight:500;color:var(--soft);text-decoration:none;padding:8px 14px;border-radius:8px;transition:color .25s,background .25s,box-shadow .25s}
.hnav a:hover{color:var(--text)}
.hnav a.on{color:var(--text);font-weight:600;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line3)}
.hrechts{display:flex;align-items:center;gap:8px;margin-left:auto}
.hnav+.hrechts{margin-left:0}
/* Feste Breite (Nutzer 17.11. „beim Sprache wechseln verschiebt sich alles“): beide Sprachen liegen übereinander in EINER
   Rasterzelle, die nicht gewählte nur unsichtbar (visibility, nicht display) -> Breite = längere Sprache, nichts rückt. */
.fest{display:inline-grid;text-align:center}.fest>*{grid-area:1/1;justify-content:center}
html[data-l="de"] .fest>[data-lang="en"],html[data-l="en"] .fest>[data-lang="de"]{display:inline-flex!important;visibility:hidden}
/* Sprache (Nutzer 17.11., 2. Wunsch): KLEINER Knopf = Sprach-Symbol + Flagge + Kürzel (DE/EN), kein Wort. Klick öffnet ein
   kleines Menü (Flagge DE / Flagge EN, Häkchen an der aktuellen). Flaggen sind eingebaute SVGs (17.11., Partner 2: Emoji-Flaggen
   fehlen unter Windows), 12 px hoch, echtes Seitenverhältnis, feiner Rand (weiße Flaggenteile auf hellem Grund). */
.langwahl{position:relative}

 cursor:pointer;font:inherit;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--soft);transition:color .2s,background .2s,border-color .2s;white-space:nowrap}
.lang:hover,.lang[aria-expanded="true"]{color:var(--text);background:var(--hover);border-color:var(--line3)}

 background:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.14);display:grid;gap:2px}
.langmenu[hidden]{display:none}
.langmenu button{min-height:44px;padding:0 10px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;font-weight:600;

.langmenu button:hover,.langmenu button:focus-visible{background:var(--hover);color:var(--text)}
.langmenu button[aria-current="true"]{color:var(--text)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:600;font-size:15px;line-height:1.1;text-decoration:none;

/* Hero */

/* Konto-Pille wie im echten Studio (Mikail 23.11. „genau wie in echt“): Kürzel „DK“ · „Dein Konto“ · grüner Punkt · „verbunden“ */
.app .ac .an{font-size:.97em;font-weight:700}   /* Stil am Eltern-Element, nie an den Sprach-Spans */
.app .ac .pt{width:.53em;height:.53em;border-radius:50%;background:#3DD68C}

.ordner3 .o.an{background:var(--chip);border-color:transparent;box-shadow:inset 0 0 0 1px var(--line3);color:var(--text)}
.ordner3 .oi{flex:none;width:2.4em;height:2.4em;border-radius:.53em;display:grid;place-items:center;background:var(--inner);box-shadow:inset 0 0 0 1px var(--line)}
.ordner3 .o.an .oi{background:var(--card);box-shadow:inset 0 0 0 1px var(--line3)}
.ordner3 .oi svg{width:1.4em;height:1.4em}
.ordner3 b{display:block;font-size:.93em;font-weight:700}

.app .kz{display:flex;justify-content:flex-end;gap:.53em}
.app .kz .ab{display:grid;place-items:center;height:2.53em;padding:0 .93em;border-radius:.53em;border:1px solid var(--line3)}

.app .kz .su svg{width:1.07em;height:1.07em}

/* Mauspfeil im Studio-Fenster (Mikail 18.11. ~20:50): macOS-Pfeil fährt zum Klick und klickt sichtbar (kleiner Kreis) –
   gleichzeitig mit dem Finger-Tipp „Senden“ im iPhone klickt er den Ordner „Gesendet“ (die Senden-Knöpfe des Fensters liegen
   unter dem iPhone); danach steht NUR Produkt 1 auf „Gesendet“, Zähler Neu −1 / Gesendet +1 (Fable 19.11.), ab der neuen
   Runde wieder „Neu“. Nur mit .bew (JS, keine „Weniger Bewegung“), nur transform; Lage misst das Skript (--zx/--zy, px im Fenster). */
.app .zl .pill.gs,.ordner3 small.z1{display:none}
.bew .fenster:is([data-ph=druck],[data-ph=gesendet],[data-ph=tts],[data-ph^=v]) .zl .pill.gs{display:inline-flex}
.bew .fenster:is([data-ph=druck],[data-ph=gesendet],[data-ph=tts],[data-ph^=v]) .zl:first-child :is(.pill.neu,.vneu,.nm){display:none}
.bew .fenster:is([data-ph=druck],[data-ph=gesendet],[data-ph=tts],[data-ph^=v]) .ordner3 small.z0{display:none}
.bew .fenster:is([data-ph=druck],[data-ph=gesendet],[data-ph=tts],[data-ph^=v]) .ordner3 small.z1{display:block}
.bew .fenster:is([data-ph=druck],[data-ph=gesendet],[data-ph=tts],[data-ph^=v]) .ordner3 .o.an{background:none;border-color:var(--line);box-shadow:none;color:var(--soft)}
.bew .fenster:is([data-ph=druck],[data-ph=gesendet],[data-ph=tts],[data-ph^=v]) .ordner3 .o:last-child{background:var(--chip);border-color:transparent;box-shadow:inset 0 0 0 1px var(--line3);color:var(--text)}
.fenster .maus{display:none}
.bew .fenster .maus{display:block;position:absolute;left:0;top:0;z-index:5;width:22px;height:33px;pointer-events:none;opacity:0;
 transform:translate(var(--zx,-40px),var(--zy,-40px));transition:transform .9s cubic-bezier(.45,.05,.25,1),opacity .35s ease}
.bew .fenster .maus.zg{opacity:1}   /* nur während einer Aktion sichtbar (Mikail 23.11.) */
.bew .fenster .maus svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.bew .fenster .maus i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:rgba(232,52,74,.35);
 box-shadow:0 0 0 2px rgba(232,52,74,.6);transform:scale(0);opacity:0;transition:transform .25s ease,opacity .25s ease}
.bew .fenster[data-ph=druck] .maus i{transform:scale(1);opacity:1}
/* Status-Pille wie im Studio: Umriss + farbiger Punkt */
.pill{display:inline-flex;align-items:center;gap:.5em;font-size:12px;font-weight:600;padding:.33em .83em;border-radius:.67em;border:1px solid var(--line2);color:var(--soft);white-space:nowrap;justify-self:start}
.pill::before{content:"";width:.5em;height:.5em;border-radius:50%;flex:none;background:var(--dot,var(--dim))}
.app .pill{font-size:.8em}
.pill.neu{--dot:#5B9BFF}.pill.ok{--dot:var(--ok)}.pill.inbox{--dot:#6F94E0}.pill.geplant{--dot:#A78BFA}.pill.frei{--dot:#3DB884}

/* Nachbildung eines iPhone 16 Pro (Nutzer 17.11.: „muss wirklich wie ein echtes Apple-iPhone sein“).
   1em = 1 % der Gerätebreite (--w). Gehäuse 71,5 × 149,6 mm, Bildschirm 9:19,5, Titanrahmen mit feiner Kante, schmaler
   schwarzer Rand, Dynamic Island, Seitentasten (links Aktionstaste + Lautstärke, rechts Seitentaste + Kamerasteuerung),
   weicher Schatten. Inhalt = echtes Standbild aus einem fertigen Video + iOS-Mitteilung. */
.iphone{--w:260px;position:relative;width:var(--w);aspect-ratio:715/1496;font-size:calc(var(--w) / 100);flex:none;text-align:left;
 border-radius:16.4em;padding:1.05em;
 background:linear-gradient(135deg,#8E8E93 0%,#4A4A4F 18%,#2C2C2F 50%,#4A4A4F 82%,#8E8E93 100%);
 box-shadow:inset 0 0 0 .22em rgba(255,255,255,.22),inset 0 0 .5em rgba(0,0,0,.55),
  0 3.2em 6em -2.6em rgba(0,0,0,.45),0 1.2em 2.4em -1.2em rgba(0,0,0,.28)}
.iphone::before{content:"";position:absolute;inset:.42em;border-radius:16em;box-shadow:inset 0 0 0 .14em rgba(0,0,0,.65);pointer-events:none}
.iphone .tk{position:absolute;width:.75em;border-radius:.4em;background:linear-gradient(90deg,#2C2C2F,#7C7C82 45%,#3A3A3D)}
.iphone .tk.l{left:-.62em}.iphone .tk.r{right:-.62em}
.iphone .tk.a{top:17.5%;height:5.6%}.iphone .tk.v1{top:26.5%;height:10.4%}.iphone .tk.v2{top:39.5%;height:10.4%}
.iphone .tk.s{top:29%;height:15.5%}.iphone .tk.k{top:59%;height:9.6%;width:.5em;right:-.4em;border-radius:.3em}
.iphone .rd{position:relative;height:100%;border-radius:15.4em;background:#000;padding:2.35em}
.iphone .bs{position:relative;height:100%;border-radius:13.2em;overflow:hidden;background:#1C1C1E;isolation:isolate}
.iphone .bs>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.iphone .insel{position:absolute;top:2.5em;left:50%;width:30.5em;height:8.6em;margin-left:-15.25em;border-radius:5em;background:#000;z-index:3}
.iphone .sb{position:absolute;top:2.6em;left:0;right:0;height:8.4em;display:flex;align-items:center;justify-content:space-between;
 padding:0 8.2em 0 10.6em;color:#111;z-index:2}
.iphone .sb b{font-size:4.25em;font-weight:600;letter-spacing:-.01em;line-height:1;font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans',system-ui,sans-serif}
.iphone .sb svg{height:3.6em;width:auto}
/* iOS-Mitteilung (Mikail 22.11. ~03:30 „cleaner“): Maße wie iOS 17 umgerechnet (1 pt ≈ 0,242 em bei 393 pt Bildschirmbreite):
   Rand 10 pt, Ecke 22 pt, Icon 38 pt mit iOS-Rundung, Titel/Text 15 pt (Titel fett, „jetzt“ rechts grau), Text höchstens 2 Zeilen
   (Test misst), Milchglas hell/dunkel wie das System, ruhiger Schatten; Abstand zur Statusleiste (.sb endet bei 11 em) 4 em. */
.iphone .mt{position:absolute;left:2.6em;right:2.6em;top:15em;z-index:4;display:flex;align-items:center;gap:2.9em;padding:3.3em 3.6em 3.3em 3.3em;
 border-radius:5.3em;background:rgba(40,40,44,.74);-webkit-backdrop-filter:blur(2.4em) saturate(1.8);backdrop-filter:blur(2.4em) saturate(1.8);
 color:#fff;box-shadow:0 1.2em 3.6em -1.4em rgba(0,0,0,.42),inset 0 0 0 .25em rgba(255,255,255,.06);
 font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans',system-ui,sans-serif}
.iphone .mt img{flex:none;width:9.2em;height:9.2em;border-radius:2.1em}
.iphone .mt .mt-ic{flex:none;display:grid;place-items:center;width:9.2em;height:9.2em;border-radius:2.1em;background:#111114;color:#fff;box-shadow:inset 0 0 0 .2em rgba(255,255,255,.14)}
.iphone .mt .mt-ic svg{width:5.4em;height:5.4em}
.iphone .mt>span{flex:1;min-width:0}
.iphone .mt .k{display:flex;justify-content:space-between;align-items:baseline;gap:2em;font-size:3.65em;line-height:1.3}
.iphone .mt .k b{font-weight:600}
.iphone .mt .k small{font-size:.88em;color:rgba(235,235,245,.6);white-space:nowrap}
.iphone .mt .t{display:block;font-size:3.65em;line-height:1.3;color:#fff}
@media (prefers-color-scheme:light){.iphone .mt{background:rgba(246,246,248,.80);color:#000;box-shadow:0 1.2em 3.6em -1.4em rgba(0,0,0,.26)}
 .iphone .mt .k small{color:rgba(60,60,67,.6)}.iphone .mt .t{color:#000}}
.iphone .home{position:absolute;left:50%;bottom:2em;width:36em;height:1.35em;margin-left:-18em;border-radius:1em;background:rgba(255,255,255,.92);z-index:2}
.buehne .iphone{position:absolute;right:1.5%;bottom:-9%;--w:clamp(188px,17vw,240px)}
@media (max-width:760px){.fenster{display:none}.buehne{display:flex;justify-content:center;padding:0 .8em}
 .buehne .iphone{position:relative;right:auto;bottom:auto;--w:min(68vw,272px)}}
/* Hero-iPhone „gekippt → gerade“ (Partner 2, 17.11.): oben leicht nach hinten gekippt, richtet sich STUFENLOS mit dem Scrollweg
   auf (Skript setzt --kp 0..1, Klasse .kipp nur solange nicht gerade). Nur transform (kein Layout, Nachbarn bleiben stehen);
   Endlage = Klasse weg = transform none = exakt das Bild ohne Effekt. Ohne JS (.js fehlt) und bei „Weniger Bewegung“: gerade. */
.js .buehne .iphone.kipp{transform-origin:50% 100%;will-change:transform;
 transform:perspective(1500px) translate3d(0,calc((1 - var(--kp,0)) * 3%),0) rotateX(calc((1 - var(--kp,0)) * 17deg)) scale(calc(1 - (1 - var(--kp,0)) * .04))}
@media (prefers-reduced-motion:reduce){.js .buehne .iphone.kipp{transform:none;will-change:auto}}
/* Kreide-Pfeil „Studio“ (Partner 2, 17.11.: „Pfeil mit ‚Studio‘ dahin, wie auf einer Tafel“): handgezeichnete SVG-Striche
   (Wort als Pfad, keine Web-Schrift) mit leicht rauem Kreide-Rand (feTurbulence + feDisplacementMap). Gedämpfte Farbe,
   nur Deko (aria-hidden, keine Klicks). Breit: links neben dem Fenster; mittel: über der linken oberen Fensterecke;
   ≤ 760 px gibt es kein Studio-Fenster -> kein Pfeil. */
.kreide{position:absolute;z-index:1;width:150px;height:auto;color:var(--muted);pointer-events:none;overflow:visible}
.kreide path{fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:1560px){.kreide{right:calc(100% + 8px);top:4%}}
@media (max-width:1559px){.kreide{left:6px;bottom:calc(100% + 2px);width:128px}}
@media (max-width:760px){.kreide{display:none}}

/* Folien: Vorschaubilder (Studio-Nachbildung) und der Vorher-Nachher-Schieberegler (Kommentar-Folie, beide Seiten mit dem
   Kommentar-Zeichner des Programms gezeichnet, tools/website_bilder.py) – nie Original-Vorlagen fremder Creator. */
.folie{position:absolute;inset:0;container-type:inline-size;background:#1C1C1E;overflow:hidden}
.folie>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.folie .pkt{position:absolute;left:0;right:0;top:3.2%;display:flex;gap:2.4%;justify-content:center;padding:0 10%;z-index:1}
.folie .pkt i{flex:1;height:.6cqw;min-height:2px;border-radius:2px;background:rgba(255,255,255,.5)}
.folie .pkt i.an{background:#fff}
/* Werbe-Kennzeichnung wie Creator sie auf die Folie setzen (Nutzer 17.11. ~18:05: „mache auch #ad“): DE #werbung, EN #ad */
.folie .ad{position:absolute;left:5%;bottom:3.5%;z-index:1;font-size:5.4cqw;font-weight:700;color:#fff;letter-spacing:.01em;
 text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.3)}

/* Sanfte Bewegung im Bild (Nutzer 17.11. ~18:05: „mehr Animationen … wie beim Scrollen sich so bewegt im Bild“): langsamer
   Zoom + Schwenk wie im TikTok-Fotomodus, 10 s hin und zurück. Ränder bleiben bedeckt (Verschiebung ≤ (Zoom−1)/2), Rahmen mit
   overflow:hidden; nur mit JS (.js), bei „Weniger Bewegung“ aus (Regel ganz unten). Nur transform -> kein Layout-Springen. */
@keyframes kb{from{transform:translate(-1%,1%) scale(1.05)}to{transform:translate(1.5%,-1.5%) scale(1.12)}}
.js .kb{animation:kb 10s ease-in-out infinite alternate;will-change:transform}

/* Vorher-Nachher-Schieberegler (Nutzer 17.11. 18:24: „vorher/nachher, wo man nach links und rechts ziehen kann, diese Linie“).
   EIN 9:16-Rahmen, beide Ebenen genau übereinander: unten die Vorlage (Vorher), oben der Nachbau, rechts der Linie
   sichtbar (clip-path inset, kein Layout). Linie/Griff per transform (--p = Stellung in %). touch-action:pan-y: senkrechtes
   Wischen scrollt die Seite, Ziehen erst ab klar waagrechter Bewegung (Skript). */
.vgl{display:grid;justify-items:center;gap:14px;width:100%}
.vn{--p:50%;position:relative;width:340px;max-width:100%;aspect-ratio:9/16;border-radius:16px;overflow:hidden;touch-action:pan-y;
 -webkit-user-select:none;user-select:none;cursor:ew-resize;box-shadow:0 18px 40px -22px rgba(0,0,0,.5);isolation:isolate;background:#1C1C1E}
.vn .folie{border-radius:inherit}
.vn img{-webkit-user-drag:none;user-drag:none}
.vn-o{clip-path:inset(0 0 0 var(--p))}
.vn-l{position:absolute;top:0;bottom:0;left:0;width:100%;z-index:3;pointer-events:none;transform:translateX(var(--p))}
.vn-l::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 0 10px rgba(0,0,0,.25)}
.vn-g{position:absolute;left:-26px;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;background:rgba(255,255,255,.96);color:#1D1D1F;
 display:grid;place-items:center;pointer-events:auto;cursor:ew-resize;box-shadow:0 4px 14px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.12);touch-action:pan-y}
.vn-g svg{width:24px;height:24px}
.vn-g:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:50%}
/* Schild „Verschieben“ am Griff: erscheint mit der Hinweis-Bewegung, verschwindet beim Ziehen oder nach ~3 s */
.vn-tipp{position:absolute;left:0;top:calc(50% + 32px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
 font-size:14px;font-weight:600;color:#fff;background:rgba(14,14,16,.78);padding:6px 11px;border-radius:999px;opacity:0;transition:opacity .3s;
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.vn-tipp.an{opacity:1}
/* nah am Rand würde das Schild aus dem Rahmen ragen (abgeschnitten „erschieben“) -> dort ausblenden (Klasse .rand vom Skript) */
.vn-tipp.an.rand{opacity:0}
/* Etiketten (Mikail 18.11. ~21:10): steht der Schieber auf „Vorher“ (Linie rechts der Mitte, Vorher füllt das Bild), ist NUR
   „Vorher“ oben LINKS zu sehen; auf „Nachher“ (Linie in der Mitte oder links) NUR „Nachher“ oben RECHTS. Nie beide: das alte
   blendet in 0,18 s aus, erst DANACH blendet das neue ein (Verzögerung 0,18 s). Ohne JS beide (Schieber geht dann nicht). */
.vn-et{position:absolute;top:14px;z-index:2;max-width:46%;padding:7px 11px;border-radius:10px;background:rgba(14,14,16,.7);color:#fff;line-height:1.2;
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .18s ease}
.js .vn-et{opacity:0}
.js .vn-et.an{opacity:1;transition:opacity .22s ease .18s}
.vn-et.l{left:12px}.vn-et.r{right:12px;text-align:right;background:rgba(15,110,68,.88)}
.vn-et b{display:block;font-size:14px;font-weight:700}
.vn-et small{display:block;font-size:14px;font-weight:500;opacity:.9}
/* Sprachwahl-Zeile (Mikail 18.11. ~21:35): zwei Teile, die nie in sich umbrechen -> höchstens 2 Zeilen; rechts darf das Etikett breiter
   sein, weil „Vorher“ und „Nachher“ nie gleichzeitig zu sehen sind */
.vn-et.r{max-width:calc(100% - 24px)}.vn-et .nw{white-space:nowrap}   /* Fable 18.11.: alles ≥ 14 px, rechts volle Breite (nie mit „Vorher“ zugleich) */
/* Karussell (Nutzer 17.11. ~21:10: „links, rechts so Pfeile … mehrere Slideshows vergleichen“): je Paar eine Schicht, nur die
   aktive sichtbar ([hidden] = nicht geladen, loading=lazy); beim Wechsel liegt die neue kurz unsichtbar oben (.lade), bis
   ihre Bilder fertig sind – kein schwarzes Aufblitzen. Helle Folien (TikTok hell): Striche + #werbung dunkel. */
.vn-paar{position:absolute;inset:0}
.vn-paar[hidden]{display:none}
.vn-paar.lade{opacity:0;z-index:1}
.vn-paar[data-modus=hell] .folie{background:#fff}
.vn-paar[data-modus=hell] .pkt i{background:rgba(0,0,0,.18)}
.vn-paar[data-modus=hell] .pkt i.an{background:rgba(0,0,0,.72)}
.vn-paar[data-modus=hell] .ad{color:#161823;text-shadow:none}
/* Markierung „Dein Name + Profilbild“ (Nutzer 17.11. ~21:10): kleine Pille mit Spitze zum Namen des (erfundenen) Creators; Stelle je Paar
   (--mkx/--mky aus website_bilder.py); sichtbar (.an) nur, wenn Name + Profilbild ganz auf der Nachher-Seite liegen. */
.vn-mark{position:absolute;left:calc(var(--mkx) + 7px);top:var(--mky);z-index:2;transform:translateY(-50%);pointer-events:none;
 max-width:calc(100% - var(--mkx) - 11px);width:max-content;font-size:12px;line-height:16px;font-weight:600;letter-spacing:-.005em;padding:3px 7px;border-radius:999px;
 background:#fff;color:#161823;box-shadow:0 2px 8px rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.vn-mark::before{content:"";position:absolute;left:-4px;top:50%;width:8px;height:8px;margin-top:-4px;background:inherit;transform:rotate(45deg);border-radius:1px}
.vn-mark.an{opacity:1}
.vn[data-modus=hell] .vn-mark{background:#161823;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.vgl-nav{display:none;align-items:center;justify-content:center;gap:14px}
.js .vgl-nav{display:flex}
.vgl-pf{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--text);
 background:var(--card);border:1px solid var(--line2);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.vgl-pf svg{width:20px;height:20px}
.vgl-pf:hover{border-color:var(--line3)}
.vgl-pf:focus-visible{outline:2px solid var(--red2);outline-offset:3px}
.vgl-z{min-width:4.2em;text-align:center;font-size:15px;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums}
/* Bildunterschrift je Paar übereinander (gleiche Höhe = nichts springt beim Wechsel), nur die aktive sichtbar */
.vgl-cap{display:grid}
.vgl-c{grid-area:1/1;visibility:hidden}
.vgl-c.an{visibility:visible}
.vgl figcaption{font-size:14px;color:var(--muted);text-align:center;max-width:320px}
.vgl figcaption b{color:var(--text);font-weight:600}
.vgl figcaption .nw{white-space:nowrap}
@media (max-width:600px){.vn{width:100%}}

/* Rohvideo-Vergleich (Punkt n, NEU Mikail 19.11. ~00:55): EIN Handy-Rahmen, darunter die Zeitleiste aus dem echten Schnitt-
   protokoll. Schritt 1 „Vorher · roh“ läuft, erreichte Stücke färben sich (rot = rausgeschnitten mit Grund, hell-rot = Pause,
   grün = bleibt); Schritt 2: rote Stücke fallen weg, Leiste schrumpft auf die fertige Länge, Rahmen wechselt auf „Nachher“.
   Danach Umschalter Vorher/Nachher. Bewegung nur über left/width/opacity der kleinen Leiste; bei „Weniger Bewegung“ keine. */
.rv{margin:8px auto 0;padding:0 0 96px;max-width:860px}
.rv .mitte{max-width:640px}
/* Mehrere Beispiele (22.11.): alle Beispiele in EINER Rasterzelle (Höhe = größtes -> Umschalten ohne Layout-Sprung), nicht
   gewähltes unsichtbar + inert (JS). Ohne JS nur das erste Beispiel, keine Pfeile. Umschalten (Mikail 22.11. nachm. „Pfeile, sehr
   clean“): zwei runde Pfeil-Knöpfe (dünne Linien, 44 px, ruhige Karte, feiner Rand) – ab 640 px links/rechts NEBEN dem iPhone
   (senkrecht mittig), darunter Beschriftung „Beispiel 1 von 2 · …“ + Punkte; am Handy alles in einer Zeile UNTER dem iPhone
   (nie über dem Video). Kreide-Notizen bleiben am alten Abstand, ihre mittlere Reihe rutscht unter die Pfeile (kein Überlauf 761 px). */
.rv-st{display:grid}
.rv-x{grid-area:1/1;min-width:0}
.rv-x:not(.an){visibility:hidden;opacity:0;pointer-events:none}
html:not(.js) .rv-nav,html:not(.js) .rv-noch,html:not(.js) .rv-x:not(.an){display:none}
.rv-nav{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,340px)}
.rv-nr{flex:1;min-width:0;margin:0;display:grid;justify-items:center;gap:7px;font-size:14px;font-weight:600;line-height:1.3;
 color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rv-pk{display:flex;gap:6px}
.rv-pk i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.rv-pk i.an{background:var(--text)}
.rv-pf{flex:none;width:44px;height:44px;display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid var(--line2);
 background:var(--card);color:var(--text);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);
 transition:border-color .2s,background-color .2s,transform .15s}
.rv-pf svg{width:20px;height:20px}
.rv-pf:hover{border-color:var(--muted)}
.rv-pf:active{transform:scale(.94)}
.rv-pf:focus-visible,.rv-noch:focus-visible{outline:2px solid var(--red2);outline-offset:3px}
@media (min-width:640px){
 .rv-nav{width:auto}
 .rv-pf{position:absolute;z-index:3;top:calc(var(--rv-ih,var(--rwk) * 2.0923) / 2 - 22px)}
 .rv-pf.l{right:calc(50% + var(--rwk) / 2 + 20px)}
 .rv-pf.r{left:calc(50% + var(--rwk) / 2 + 20px)}
}
.rv-noch{display:flex;align-items:center;gap:8px;margin:30px auto 0;min-height:44px;padding:0 18px;border:0;border-radius:999px;
 background:none;font:inherit;font-size:16px;font-weight:650;color:var(--text);cursor:pointer}
.rv-noch svg{width:18px;height:18px;transition:transform .2s}
.rv-noch:hover>span{text-decoration:underline;text-underline-offset:4px}
.rv-noch:hover svg{transform:translateX(3px)}
@keyframes rvGlR{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes rvGlL{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
.rv-x.gl-r{animation:rvGlR .4s cubic-bezier(.2,.7,.2,1)}
.rv-x.gl-l{animation:rvGlL .4s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.rv-x.gl-r,.rv-x.gl-l{animation:none!important}.rv-noch svg,.rv-pf{transition:none}}
.rv-h{margin:6px 0 0;font-size:clamp(28px,4.2vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.08}
.rv-b{display:grid;justify-items:center;gap:18px;margin:40px auto 0;max-width:560px}
/* Rahmen so groß, dass Rahmen + Zeitleiste + Text + Umschalter zusammen auf den Bildschirm passen (svh = sichtbare Höhe am Handy) */
.rv-r{position:relative;width:min(300px,100%,max(180px,calc((100vh - 330px) * .5625)));aspect-ratio:9/16;border-radius:36px;overflow:hidden;background:#111113;isolation:isolate;
 border:7px solid #0B0B0D;box-shadow:0 0 0 1px var(--line2),0 30px 60px -28px rgba(0,0,0,.65)}
.js .rv-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#111113;opacity:0;transition:opacity .45s ease}
.js .rv-v.an{opacity:1}
.js .rv-v::-webkit-media-controls{display:none!important}
html:not(.js) .rv-r{display:grid;grid-template-columns:1fr 1fr;gap:6px;aspect-ratio:auto;width:min(560px,100%);border-radius:18px}
html:not(.js) .rv-v{width:100%;height:auto;aspect-ratio:9/16;display:block}
html:not(.js) .rv-et,html:not(.js) .rv-d,html:not(.js) .rv-u{display:none}
.rv-et,.rv-d{position:absolute;z-index:2;padding:5px 10px;border-radius:9px;font-size:14px;font-weight:700;line-height:1.2;color:#fff;white-space:nowrap;
 background:rgba(14,14,16,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none}
.rv-et{top:12px;left:12px;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.rv-d{left:12px;bottom:14px;font-variant-numeric:tabular-nums}
.rv-et .e-n{display:none}
/* Fable 22.11.: Schild im iPhone nie mit „…“ – passt es nicht in die Innenbreite (kleines iPhone, 360 px / niedrige Fenster), fällt
   der Zusatz („ · geschnitten“, „ · roh“, „ · fertig“) weg (Skript setzt .kurz), Schrift bleibt ≥ 14 px */
.rv-et.kurz .e-z{display:none}
.rv-b[data-ph=nachher] .rv-et .e-v{display:none}.rv-b[data-ph=nachher] .rv-et .e-n{display:inline}
.rv-b[data-ph=nachher] .rv-et{background:rgba(15,110,68,.88)}
.rv-k{display:none;position:absolute;right:12px;bottom:10px;z-index:2;min-height:44px;padding:0 16px 0 13px;border:0;border-radius:999px;
 align-items:center;gap:7px;font:inherit;font-size:14px;font-weight:700;color:#1D1D1F;background:rgba(255,255,255,.94);cursor:pointer;
 box-shadow:0 6px 18px -6px rgba(0,0,0,.45);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.js .rv-k{display:inline-flex}
.rv-k>span{display:none;align-items:center;gap:7px;white-space:nowrap}
.rv-k[data-st=p] .k-p,.rv-k[data-st=an] .k-an,.rv-k[data-st=aus] .k-aus{display:inline-flex}
.rv-k svg{width:18px;height:18px;flex:none}
.rv-k:focus-visible,.rv-u button:focus-visible{outline:2px solid var(--red2);outline-offset:3px}
@media (hover:hover) and (prefers-reduced-motion:no-preference){.rv-k:hover{transform:scale(1.04)}}
/* Zeitleiste: Maßstab 100 % = Roh-Ausschnitt; --l/--w = Lage roh, --l2/--w2 = Lage nach dem Schnitt (aus dem Protokoll gerechnet) */
.rv-tl{position:relative;width:100%;padding-top:34px}
.rv-sp{position:relative;height:12px}
.rv-sp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:6px;background:var(--line);transition:width .7s cubic-bezier(.4,0,.2,1)}
.rv-s{position:absolute;top:0;bottom:0;left:var(--l);width:var(--w);border-radius:4px;background:var(--line2);box-shadow:0 0 0 1px var(--bg) inset;
 transition:left .7s cubic-bezier(.4,0,.2,1),width .7s cubic-bezier(.4,0,.2,1),opacity .45s,background-color .25s}
.rv-s.weg.an{background:var(--red)}
.rv-s.pause.an{background:var(--redbg);background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(232,52,74,.45) 3px 5px)}
.rv-s.bleibt.an{background:#30A46C}
.rv-s.fe{left:var(--l2);width:0;opacity:0;background:#30A46C}
.rv-s.fe.f2{background:#2C8A5C}
.rv-b:not([data-ph=vorher]) .rv-sp::before{width:var(--gw)}
.rv-b:not([data-ph=vorher]) .rv-s.weg,.rv-b:not([data-ph=vorher]) .rv-s.pause{width:0;left:var(--l2);opacity:0}
.rv-b:not([data-ph=vorher]) .rv-s.bleibt{left:var(--l2);background:#30A46C}
.rv-b[data-ph=nachher] .rv-s.bleibt{opacity:0}
.rv-b[data-ph=nachher] .rv-s.fe{width:var(--w2);opacity:1;transition-delay:0s,.05s,0s,0s}
.rv-b[data-ph=nachher] .rv-s.f2{transition-delay:0s,.2s,0s,0s}
.rv-ph{position:absolute;top:-5px;bottom:-5px;left:calc(var(--p,0) * 1%);width:3px;margin-left:-1.5px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--bg)}
.rv-chip{position:absolute;top:0;left:var(--m);transform:translateX(-50%);padding:3px 8px;border-radius:7px;font-size:14px;font-weight:700;line-height:1.3;
 color:#fff;background:var(--red);white-space:nowrap;opacity:0;transition:opacity .3s}
.rv-chip.an{opacity:1}.rv-chip.ok{background:#1F8A57}
.rv-chip.rand-l{transform:none}.rv-chip.rand-r{transform:translateX(-100%)}
.js .rv-chip[style*="--x"]{left:var(--x);transform:none}   /* Lage vom Skript: nie übereinander, nie aus der Leiste (schmale Handys) */
.rv-b:not([data-ph=vorher]) .rv-chip{opacity:0}
.rv-sk{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;line-height:1.3;color:var(--dim);font-variant-numeric:tabular-nums}
.rv-sk .n,.rv-b:not([data-ph=vorher]) .rv-sk .v{display:none}
.rv-b:not([data-ph=vorher]) .rv-sk .n{display:flex;justify-content:space-between;width:var(--gw)}
.rv-sk .v{display:flex;justify-content:space-between;width:100%}
.rv-z{position:relative;width:100%;min-height:4.35em;margin:0;font-size:14px;line-height:1.45;color:var(--muted);text-align:center}
.rv-z>span{display:none}.rv-z>span.an{display:block}
.rv-z b{color:var(--text)}
.rv-u{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;padding:5px;border-radius:16px;background:var(--card);border:1px solid var(--line2)}
.rv-u button{min-height:48px;padding:6px 10px;border:0;border-radius:11px;font:inherit;font-size:15px;font-weight:700;line-height:1.25;color:var(--muted);
 background:transparent;cursor:pointer;display:grid;place-content:center;text-align:center;transition:background-color .2s,color .2s}
.rv-u button small{display:block;font-size:14px;font-weight:600;color:var(--dim);white-space:nowrap}
@media (max-width:374px){.rv-u .ud{display:none}}   /* schmale Handys: Dauer steht ohnehin im Rahmen */
.rv-u button[aria-pressed=true]{color:var(--text);background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px var(--line2)}
.rv-u button[aria-pressed=true] small{color:var(--muted)}
.rv-fuss{margin:28px auto 0;max-width:620px;font-size:14px;line-height:1.5;color:var(--dim);text-align:center}
@supports (height:100svh){.rv-r{width:min(300px,100%,max(180px,calc((100svh - 330px) * .5625)))}}
@media (max-width:600px){.rv{padding-bottom:72px}.rv-b{margin-top:28px;gap:14px}.rv-r{border-radius:30px;border-width:6px}
 .rv-et{top:8px;left:8px;padding:4px 8px}.rv-d{left:8px;bottom:12px;padding:4px 8px}
 .rv-k{right:8px;bottom:8px;width:44px;height:44px;padding:0;justify-content:center}.rv-k>span>span{display:none}}

/* Fakten-Leiste */
.fakten{padding:84px 0 0}
.fakten ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.fakten li{padding:26px 24px;border-left:1px solid var(--line2)}
.fakten li:first-child{border-left:0;padding-left:0}
.fakten b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.fakten span:not([data-lang]){display:block;color:var(--muted);font-size:15px;margin-top:4px}
@media (max-width:900px){.fakten ul{grid-template-columns:1fr 1fr}.fakten li{border-left:0;padding:22px 0}.fakten li:nth-child(even){padding-left:20px;border-left:1px solid var(--line2)}
 .fakten li:nth-child(n+3){border-top:1px solid var(--line2)}}
@media (max-width:600px){.fakten{padding-top:56px}.fakten ul{grid-template-columns:1fr}.fakten li,.fakten li:nth-child(even){padding:18px 0;border-left:0}.fakten li+li{border-top:1px solid var(--line2)}}

/* Funktions-Reihen */
.reihe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:72px;align-items:center}
.reihe+.reihe{margin-top:140px}
.reihe.um .rt{order:2}
.rt .lead{margin-top:18px}
.punkte{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:12px}
.punkte li{display:flex;gap:12px;align-items:flex-start;font-size:16px;color:var(--soft)}
.punkte li svg{flex:none;width:20px;height:20px;margin-top:2px;color:var(--redt)}
/* Kachel = Ausschnitt aus dem Studio: ruhige Studio-Fläche (17.11.: ohne eigenes Raster/Licht), darin eine Studio-Karte */
.kachel{position:relative;border-radius:24px;padding:44px;overflow:hidden;min-height:440px;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;
 border:1px solid var(--line2);background:var(--inner)}
@media (max-width:900px){.reihe{grid-template-columns:minmax(0,1fr);gap:36px}.reihe.um .rt{order:0}.reihe+.reihe{margin-top:96px}}
@media (max-width:600px){.kachel{padding:24px 16px;min-height:0;border-radius:20px}}

/* Kachel: Vorlage -> Nachbau = Vorher-Nachher-Schieberegler (CSS oben bei .vn) */
.vgl figure{margin:0}
.chipzeile{display:flex;justify-content:center;gap:8px;margin-top:22px;white-space:nowrap}
.chipzeile .pill{font-size:14px;background:var(--card)}
@media (max-width:600px){.chipzeile{margin-top:16px}}

/* Kachel: Schnitt (Studio-Karte) */
.schnitt{width:100%;max-width:520px;padding:22px}
.schnitt .k{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
.schnitt .k b{font-size:17px;font-weight:700}
.schnitt .k small{color:var(--muted);font-size:13px}
.spur{display:flex;gap:4px;height:46px}
.spur i{position:relative;border-radius:8px;background:var(--chip);overflow:hidden}
.spur i.b{background:var(--red)}
.spur i.b::after{content:"";position:absolute;inset:30% 8%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 2px,transparent 2px 5px);border-radius:2px}
.spur i.x{background:repeating-linear-gradient(135deg,var(--chip) 0 6px,transparent 6px 11px);border:1px dashed var(--line3)}
.legende{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.legende span:not([data-lang]){font-size:12.5px;color:var(--muted);padding:4px 9px;border-radius:7px;background:var(--inner)}
.pruef{list-style:none;margin:20px 0 0;padding:18px 0 0;border-top:1px solid var(--line);display:grid;gap:11px}
.pruef li{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--soft)}
.pruef li i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--okbg);color:var(--ok)}
.pruef li i svg{width:13px;height:13px}
.pruef li small{margin-left:auto;color:var(--dim);font-size:13px;white-space:nowrap}
.schnitt .fz{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.schnitt .fz .pill{font-size:12.5px}
.kbtn{display:inline-flex;align-items:center;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line3);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}

/* Kachel: „Heute geplant“ (Studio-Karte der Übersicht) */
.plan-k{width:100%;max-width:470px;padding:22px}
.plan-k .k{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px}
.plan-k .k b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.slot{display:flex;align-items:center;gap:14px}
.slot+.slot{margin-top:12px}
.slot time{flex:none;width:52px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.slot .box{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:10px;background:var(--inner);border:1px solid var(--line)}
.slot .th{flex:none;width:30px;height:40px;border-radius:6px;object-fit:cover;background:var(--chip)}
.slot .t{flex:1 1 150px;min-width:0}
.slot .t b{display:block;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:break-word}
.slot .t small{display:block;font-size:12px;color:var(--dim);white-space:nowrap}
@media (max-width:600px){.plan-k{padding:16px 12px}.slot{gap:8px}.slot time{width:44px;font-size:14px}.slot .box{padding:9px 10px;gap:10px}.slot .th{display:none}}

/* Kontrolle */
.drei{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:56px}
.karte{padding:30px;border-radius:18px}
.karte p{margin:10px 0 0;color:var(--muted);font-size:16px}
.mitte{text-align:center;max-width:760px;margin:0 auto}
.mitte .lead{max-width:640px;margin-left:auto;margin-right:auto}
@media (max-width:900px){.drei{grid-template-columns:1fr;gap:14px;margin-top:40px}.karte{padding:24px}}

/* Beta-Tester */
.beta{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:center;padding:56px;border-radius:24px}
.beta .lead{margin-top:18px}
.beta .knoepfe{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.zahl{margin:0;display:flex;align-items:baseline;gap:14px}
.zahl b{font-size:clamp(72px,8.5vw,112px);font-weight:700;letter-spacing:-.045em;line-height:.9}
.zahl span{font-size:21px;font-weight:700;color:var(--soft);letter-spacing:-.01em}
/* Creator-Chips (Pillen mit Rand, Profilbild links). Nutzer 17.11. ~18:05: jeder Chip = Link zum TikTok-Profil (neuer Tab),
   Tippfläche ≥ 44 px, dezenter Hover/Fokus; „+1“ ohne Link. */
.b-namen{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.b-namen li{display:flex;min-width:0}
.b-namen .bc,.b-namen li.mehr{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:5px 15px 5px 5px;border-radius:999px;border:1px solid var(--line2);
 background:var(--inner);font-size:15px;font-weight:600;line-height:1.2}
.b-namen .bc{text-decoration:none;color:var(--text);transition:border-color .2s,background .2s}
.b-namen .bc:hover{border-color:var(--line4);background:var(--hover)}
.b-namen .bc:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:999px}
.b-namen .bn{min-width:0}
.b-namen .bi{flex:none;width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--muted);overflow:hidden;
 box-shadow:inset 0 0 0 1px var(--line2)}
.b-namen .bi svg{width:17px;height:17px}
.b-namen .bi img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.b-namen li.mehr{color:var(--muted);font-weight:500;background:transparent;border-style:dashed;border-color:var(--line3)}
/* Handy (Nutzer 17.11. ~18:05 „im Stil von davor, aber anders positioniert“): Pillen-Chips in einem Raster mit 2 gleich breiten
   Spalten, alle gleich hoch (Zeilen 1fr), Namen nie abgeschnitten (Umbruch nur an der erlaubten Stelle <wbr>);
   „+2 weitere“ füllt die freie Zelle (2×2) bzw. bei gerader Namenszahl die volle Breite (.voll), mittig, gestrichelt. */
@media (max-width:600px){.b-namen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;margin-top:20px}
 .b-namen .bc,.b-namen li.mehr{width:100%;gap:7px;padding:4px 10px 4px 4px;font-size:14px}
 .b-namen .bc{border-radius:26px}
 .b-namen .bi{width:30px;height:30px}
 .b-namen li.mehr{justify-content:center;padding-right:16px}
 .b-namen li.mehr.voll{grid-column:1/-1}
 .b-namen .bn{white-space:nowrap}}
/* Sehr schmale Handys (< 420 px): eine Spalte ist zu schmal für Bild + längsten Namen in EINER Zeile (Fable 17.11.: „Ein Name
   muss einzeilig bleiben“, Schrift ≥ 14 px) -> Bild über dem Namen, beide mittig; „und 1 weiterer“ genauso. */
@media (max-width:419px){.b-namen .bc,.b-namen li.mehr{flex-direction:column;justify-content:center;gap:6px;padding:10px 8px;border-radius:18px;text-align:center}
 .b-namen .bc:focus-visible{border-radius:18px}
 .b-namen .bi{width:34px;height:34px}}
.beta .leise{margin:14px 0 0}
@media (max-width:900px){.beta{grid-template-columns:minmax(0,1fr);gap:34px;padding:34px}}
@media (max-width:600px){.beta{padding:26px 18px;border-radius:20px}.beta .knoepfe{flex-direction:column;align-items:stretch}}

/* Ablauf */
.ablauf{counter-reset:s;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:56px 0 0;padding:0;list-style:none}
/* Zahl ohne Kreis (Partner 2, 17.11.: „schön in der Ecke, nicht ganz sichtbar … clean, professionell“): groß, oben rechts,
   über den Kartenrand angeschnitten (li overflow hidden), sehr geringer Kontrast (hell/dunkel getrennt), HINTER dem Text
   (eigener Stapelkontext der Karte, Zahl z-index -1 = über dem Kartengrund, unter dem Text). */
.ablauf li{padding:30px 30px 32px;border-radius:18px;overflow:hidden;isolation:isolate;--ziffer:rgba(255,255,255,.075)}
@media (prefers-color-scheme:light){.ablauf li{--ziffer:rgba(0,0,0,.06)}}
.ablauf li::after{counter-increment:s;content:counter(s);position:absolute;z-index:-1;top:-34px;right:-12px;font-size:132px;font-weight:800;line-height:1;
 letter-spacing:-.06em;font-variant-numeric:tabular-nums;color:var(--ziffer);pointer-events:none}
.ablauf li h3{margin-top:30px;padding-right:64px}
.ablauf p{margin:10px 0 0;color:var(--muted);font-size:16px}
@media (max-width:900px){.ablauf{grid-template-columns:1fr;gap:14px;margin-top:40px}.ablauf li{padding:24px}
 .ablauf li::after{top:-28px;right:-10px;font-size:112px}.ablauf li h3{margin-top:24px;padding-right:58px}}
/* Nacheinander einblenden (Stufe 2): nur wenn die drei Karten nebeneinander stehen; untereinander kommt jede beim Scrollen selbst */
@media (min-width:901px){.js .ablauf li.auf:nth-child(2){transition-delay:.1s}.js .ablauf li.auf:nth-child(3){transition-delay:.2s}}

/* Preise */
.umschalter{display:inline-grid;grid-auto-flow:column;gap:2px;padding:2px;border-radius:10px;background:var(--seg-schiene);margin-top:30px}
.umschalter button{font-family:inherit;font-weight:600;font-size:14px;line-height:1;color:var(--seg-aus);background:transparent;border:0;padding:0 16px;min-height:44px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.umschalter button[aria-pressed="true"]{background:var(--seg-pille);box-shadow:var(--seg-schatten);color:var(--text)}
.umschalter .spar{font-size:14px;font-weight:700;color:var(--ok);background:var(--okbg);padding:3px 7px;border-radius:6px}
html:not(.js) .umschalter{display:none}
.plaene{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:48px;text-align:left}
.pk{display:grid;grid-template-rows:subgrid;grid-row:span 6;gap:0;border-radius:20px;padding:32px 30px}
/* Komplett „mehr hypen“ (Nutzer 17.11.: „Nicht nur dieser rote Rand, bisschen dicker oder so der Rand. Und mehr Animationen,
   wenn man mit der Maus rübergeht.“): 2-px-Rand (Innenabstand −1 px, damit die Zeilen mit den Nachbarn bündig bleiben),
   roter Schein, kräftiges Abzeichen; Hervorheben/Hover NUR per transform (kein Layout-Sprung), Animationen nur mit Maus
   und ohne „Bewegung reduzieren“. */

   Regel ist das Netz für künftige „… span“-Regeln gleicher Stärke (display bleibt: Sprachwechsel über !important oben). */
:is(.app,.fakten,.legende) span[data-lang]{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;margin:0;padding:0;
 border:0;border-radius:0;background:none}
h1 .hpk,h2 .hpk{margin-left:-.095em}h1 .hpk.schr,h2 .hpk.schr{margin-left:-.065em}   /* Punkt am Zeilenende (h1 + seit 18.11. alle h2): „.“ hat links 0,12 em Luft -> wie ein Buchstabenabstand (punkt_eng/h2_punkte) */

/* iPhone-Bildschirm (Ausnahme Zusatz 3): TikTok-Ansicht schwarz, Statusleiste weiß (statt hellem Video-Standbild 672671c) */
.iphone .bs{background:#000}.iphone .sb{color:#fff}
/* Hero-iPhone = TikTok-Foto-Ansicht (Mikail 18.11.: kein Bild/Video von ihm): 9:16-Box unten im 9:19,5-Bildschirm (oben schwarz
   wie in der App, dort liegen Statusleiste und Mitteilung), 4 Folien seiner Slideshows, Wechsel alle 2,2 s mit weichem Wischen
   (nur transform, kein Layout). Fortschritts-Striche oben in der Box, dezent. Ohne JS / „Weniger Bewegung“: Folie 1 steht still.
   Zustände: ohne Klasse = rechts wartend (Sprung ohne Übergang), .an = sichtbar, .weg = nach links hinaus.
   Je Folie ein .fo mit zwei Bildern (data-lang de/en, die andere Sprache blendet die globale Sprach-Regel aus). */
.iphone .tts{position:absolute;left:0;right:0;bottom:0;aspect-ratio:9/16;overflow:hidden;background:#000}
.iphone .tts .fo{position:absolute;inset:0;transform:translateX(100%)}
.iphone .tts .fo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.iphone .tts .fo.an{transform:none;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.iphone .tts .fo.weg{transform:translateX(-100%);transition:transform .7s cubic-bezier(.3,.7,.2,1)}
html:not(.js) .iphone .tts .fo:not(:first-child){display:none}
.iphone .tts .fs{position:absolute;left:4em;right:4em;top:6em;display:flex;gap:1.2em;z-index:1}
.iphone .tts .fs i{flex:1;height:.55em;border-radius:1em;background:rgba(255,255,255,.32)}
.iphone .tts .fs i.an{background:rgba(255,255,255,.9);transition:background .4s}
/* Hero-iPhone „Beides abwechselnd“ (Mikail 18.11. ~12:35): vor der Slideshow die Handy-Ansicht des STUDIOS (.sv, seit Mo 18.11.
   ~19:45 ECHTE Studio-Bilder, hell/dunkel wie die Seite): Videos › Slideshows › Neu mit Knopf „Senden“, danach Ordner „Gesendet“. Abfolge per Skript über data-ph am Bildschirm (.bs):
   studio -> druck (Knopf gedrückt) -> gesendet (Knopf „Gesendet“, Mitteilung kommt, data-mt) -> tts (Studio schiebt hinaus, die
   Slideshow läuft in TikTok) -> studio … Nur mit Klasse .bew (JS + keine „Weniger Bewegung“); ohne = Standbild Folie 1 + Mitteilung.
   WECHSEL (Partner 2, 18.11. Zusatz 3, Live-Fehler dfcd754: Studio-Ansicht blendete .6 s halbdurchsichtig über der schon
   sichtbaren Slideshow aus -> Folie doppelt + versetzt, „Gesendet“ halbdurchsichtig): seit 18.11. NUR noch Schieben, nie
   Überblenden. Studio -> Slideshow = Studio-Ansicht schiebt nach links hinaus, die Slideshow (.tts) schiebt gleichzeitig von rechts
   herein (wie ein App-Wechsel); zurück umgekehrt. Deckkraft bleibt immer 1, also nie zwei Inhalte halbdurchsichtig übereinander.
   Mitteilung kommt nur per Verschieben von oben, die Knopf-Beschriftung wechselt hart (ohne Überblenden). Test: Zwischenbilder
   alle 50 ms (website_startseite_test.py, „Wechsel ohne Doppelbild“) + Gegenprobe mit dem alten Wechsel. */
.iphone .sv{position:absolute;inset:0;z-index:1;display:none;background:var(--bg);transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.bew .iphone .bs[data-ph] .sv{display:flex}
/* echte Studio-Bilder (website_hero_studio.py, 780 × 1674 = 390 × 837 bei Pixeldichte 2): füllen den Bildschirm; Bild 2 („Gesendet“)
   liegt deckungsgleich darüber und wird HART eingeschaltet (visibility, Deckkraft immer 1 – nie zwei Bilder halbdurchsichtig) */
.iphone .sv-s{position:absolute;inset:0}
.iphone .sv-s picture{display:contents}
.iphone .sv-s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.iphone .sv-s.s2{visibility:hidden}
.bew .iphone .bs[data-ph=gesendet] .sv-s.s1,.bew .iphone .bs[data-ph=tts] .sv-s.s1{visibility:hidden}
.bew .iphone .bs[data-ph=gesendet] .sv-s.s2,.bew .iphone .bs[data-ph=tts] .sv-s.s2{visibility:visible}
/* Tipp-Kreis auf dem Knopf „Senden“ (Lage gemessen): nur in „druck“, nur transform (Fingerdruck), ohne Inhalt (kein Bild/Text) */
.iphone .sv-tipp{position:absolute;z-index:1;border-radius:999px;visibility:hidden;box-shadow:0 0 0 .9em rgba(232,52,74,.28),inset 0 0 0 .5em rgba(232,52,74,.55);
 transform:scale(1.25);transition:transform .25s ease}
.bew .iphone .bs[data-ph=druck] .sv-tipp:not(.vt){visibility:visible;transform:scale(.94)}
/* Video-Ablauf v1–v6: je Phase genau EIN Bild sichtbar (hart, visibility – nie zwei halbdurchsichtig), Finger nur in den letzten
   HS_TIPP_MS (data-tp) auf der Stelle, die zum nächsten Bild führt; „wisch“ = Finger schiebt nach oben (Seite scrollt) */
.iphone .sv-s.v1,.iphone .sv-s.v2,.iphone .sv-s.v3,.iphone .sv-s.v4,.iphone .sv-s.v5,.iphone .sv-s.v6{visibility:hidden}
.bew .iphone .bs[data-ph^=v] .sv-s.s1{visibility:hidden}
.bew .iphone .bs[data-ph=v1] .sv-s.v1,.bew .iphone .bs[data-ph=v2] .sv-s.v2,.bew .iphone .bs[data-ph=v3] .sv-s.v3,
.bew .iphone .bs[data-ph=v4] .sv-s.v4,.bew .iphone .bs[data-ph=v5] .sv-s.v5,.bew .iphone .bs[data-ph=v6] .sv-s.v6{visibility:visible}
.bew .iphone .bs[data-ph=v1][data-tp] .sv-tipp.v1,.bew .iphone .bs[data-ph=v2][data-tp] .sv-tipp.v2,.bew .iphone .bs[data-ph=v3][data-tp] .sv-tipp.v3,
.bew .iphone .bs[data-ph=v4][data-tp] .sv-tipp.v4,.bew .iphone .bs[data-ph=v5][data-tp] .sv-tipp.v5{visibility:visible;transform:scale(.94)}
.iphone .sv-tipp.wisch{transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.bew .iphone .bs[data-ph=v3][data-tp] .sv-tipp.wisch{transform:translateY(-320%) scale(.94)}
.bew .iphone .bs[data-ph=tts] .sv{transform:translateX(-100%);visibility:hidden;transition:transform .6s cubic-bezier(.3,.7,.2,1),visibility 0s linear .6s}
