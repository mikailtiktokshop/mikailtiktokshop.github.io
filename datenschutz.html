:root{color-scheme:dark;
 --bg:#0E0E10;--bar:rgba(20,20,22,.72);--card:#1C1C1F;--inner:#252528;--raise:#2A2A2E;--hover:#29292D;--chip:#333338;--field:#141416;--toast:#2A2A2E;

 --line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.10);--line3:rgba(0,0,0,.15);--line4:rgba(0,0,0,.22);

 --licht:rgba(255,255,255,.9);--lead:#4A4A4F;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px;background:var(--bg)}
[tabindex="-1"]:focus{outline:none}   /* Sprungziele (ANKER_JS) bekommen Fokus, aber keinen Rahmen */
/* Hintergrund (Mikail 18.11., WÜNSCHE 4 Punkt 1 „clean“): KEIN Raster mehr (früher 44-px-Karo), nur ein sehr feines
   radiales Licht oben hinter dem Hero (--licht, läuft mit der Seite mit). body als eigener Stapelkontext (::before z-index -1). */
body{margin:0;isolation:isolate;background:var(--bg);
 color:var(--text);overflow-x:hidden;
 font:17px/1.55 'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:absolute;left:0;right:0;top:0;height:900px;z-index:-1;pointer-events:none;
 background:radial-gradient(ellipse 60% 70% at 50% 0%,var(--licht),transparent 70%)}
html[data-l="de"] [data-lang="en"],html[data-l="en"] [data-lang="de"]{display:none!important}
a{color:inherit}
img,svg{display:block}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--card);color:var(--text);padding:10px 14px;border-radius:10px;border:1px solid var(--line3)}
.skip:focus{top:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
@media (max-width:600px){.wrap{padding:0 20px}}

/* Karten wie im Studio (17.11.: ohne Maus-Licht – ruhige Fläche) */
.card{position:relative;background:var(--card);border:1px solid var(--cardline);border-radius:16px;box-shadow:var(--cardsh)}

/* Kopfzeile (wie Studio: Logo + Wortmarke, Reiter-Pille in der Mitte) */
.top{position:sticky;top:0;z-index:50;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.marke{display:flex;align-items:center;gap:11px;min-height:44px;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1}
.marke img{width:36px;height:36px;border-radius:8px;object-fit:cover}
.marke b{color:var(--red);font-weight:700}
.hnav{display:flex;gap:4px;padding:4px;margin:0 auto;border:1px solid var(--line);border-radius:12px;background:var(--inner)}
.hnav a{font-size:14px;font-weight:500;color:var(--soft);text-decoration:none;padding:8px 14px;border-radius:8px;transition:color .25s,background .25s,box-shadow .25s}
.hnav a:hover{color:var(--text)}
.hnav a.on{color:var(--text);font-weight:600;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line3)}
.hrechts{display:flex;align-items:center;gap:8px;margin-left:auto}
.hnav+.hrechts{margin-left:0}
/* Feste Breite (Nutzer 17.11. „beim Sprache wechseln verschiebt sich alles“): beide Sprachen liegen übereinander in EINER
   Rasterzelle, die nicht gewählte nur unsichtbar (visibility, nicht display) -> Breite = längere Sprache, nichts rückt. */
.fest{display:inline-grid;text-align:center}.fest>*{grid-area:1/1;justify-content:center}
html[data-l="de"] .fest>[data-lang="en"],html[data-l="en"] .fest>[data-lang="de"]{display:inline-flex!important;visibility:hidden}
/* Sprache (Nutzer 17.11., 2. Wunsch): KLEINER Knopf = Sprach-Symbol + Flagge + Kürzel (DE/EN), kein Wort. Klick öffnet ein
   kleines Menü (Flagge DE / Flagge EN, Häkchen an der aktuellen). Flaggen sind eingebaute SVGs (17.11., Partner 2: Emoji-Flaggen
   fehlen unter Windows), 12 px hoch, echtes Seitenverhältnis, feiner Rand (weiße Flaggenteile auf hellem Grund). */
.langwahl{position:relative}
.lang{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:transparent;
 cursor:pointer;font:inherit;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--soft);transition:color .2s,background .2s,border-color .2s;white-space:nowrap}
.lang:hover,.lang[aria-expanded="true"]{color:var(--text);background:var(--hover);border-color:var(--line3)}
.lang>svg{width:17px;height:17px;flex:none}
.lang .fest>span,.langmenu button{display:inline-flex;align-items:center;gap:5px}
.lang .fl,.langmenu .fl{display:block;flex:none;width:auto;height:12px;border-radius:2px;box-shadow:0 0 0 1px var(--line3);margin-right:1px}
.langmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:60;min-width:112px;padding:4px;border-radius:12px;border:1px solid var(--line2);
 background:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.14);display:grid;gap:2px}
.langmenu[hidden]{display:none}
.langmenu button{min-height:44px;padding:0 10px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;font-weight:600;
 color:var(--soft);cursor:pointer;gap:8px;text-align:left}
.langmenu button:hover,.langmenu button:focus-visible{background:var(--hover);color:var(--text)}
.langmenu button[aria-current="true"]{color:var(--text)}
.langmenu button svg:not(.fl){width:16px;height:16px;margin-left:auto;visibility:hidden;color:var(--redt)}
.langmenu button[aria-current="true"] svg:not(.fl){visibility:visible}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:600;font-size:15px;line-height:1.1;text-decoration:none;
 color:#fff;background:var(--btn);padding:13px 22px;border-radius:10px;border:1px solid var(--btn);cursor:pointer;
 transition:background .25s,border-color .25s;white-space:nowrap}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn .pf{width:17px;height:17px;transition:transform .25s}
.btn:hover .pf{transform:translateX(3px)}
.btn.klein{font-size:14px;padding:9px 14px}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;text-decoration:none;color:var(--text);
 padding:13px 22px;border-radius:10px;border:1px solid var(--line3);background:transparent;transition:background .25s,border-color .25s;white-space:nowrap}
.btn2:hover{background:var(--hover);border-color:var(--line4)}

@media (max-width:600px){.top .wrap{gap:10px;height:60px}.top .btn.klein,.top .hrechts>.fest{display:none!important}.marke{font-size:17px}.marke img{width:34px;height:34px}
 .btn,.btn2{min-height:48px}}

/* Typografie */
.kicker{display:inline-block;font-size:14px;font-weight:700;color:var(--redt);letter-spacing:.01em;margin:0 0 14px}
/* Reiter-Marke über den Funktionen: Symbol + Name wie der aktive Studio-Reiter */
.reiter{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:5px 13px 5px 8px;border-radius:10px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line3);
 font-size:14px;font-weight:600;color:var(--text)}
.ni{width:22px;height:22px;flex:none}
.ni .f{fill:currentColor;fill-opacity:.16}
.ni .g{fill:currentColor;stroke-width:1.5}
h1,h2,h3{margin:0;letter-spacing:-.028em;font-weight:700;text-wrap:balance}
h1{font-size:clamp(40px,6vw,72px);line-height:1.05}
h2{font-size:clamp(30px,4.2vw,50px);line-height:1.1}
h3{font-size:21px;font-weight:700;letter-spacing:-.015em;line-height:1.28}
.lead{font-size:clamp(17px,1.8vw,20px);line-height:1.55;color:var(--muted);margin:22px 0 0;text-wrap:pretty}
.leise{color:var(--dim);font-size:14px}
section{padding:120px 0}
@media (max-width:600px){section{padding:76px 0}}

/* Hero (Mikail 18.11., WÜNSCHE 4 Punkt 1): Abstände im 8-px-Raster, klare Hierarchie Kicker -> h1 -> Unterzeile -> Knöpfe ->
   Vertrauenszeile. Kicker = feine Pille (1-px-Rand, roter Punkt). Unterzeile ≤ 2 Zeilen am Desktop (max-width ~56 Zeichen),
   kräftiger (--lead). Knöpfe gleich hoch (48 px Handy … 50 px), Haupt-Knopf mit feinem Innenlicht + ruhigem neutralem Schatten,
   zweiter Knopf als „Ghost“ mit dünnem Rand. EIN ruhiges Einblenden des Text-Blocks beim Laden (600 ms, 8 px), ohne JS und bei
   „Weniger Bewegung“ keins (globale Regel unten). */
.hero{padding:96px 0 40px;text-align:center}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;margin:0 0 24px;padding:6px 14px 6px 12px;border-radius:999px;
 border:1px solid var(--line3);background:var(--inner);color:var(--soft);font-weight:600;font-size:14px;line-height:20px;letter-spacing:0}
.hero .kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
h1 .hpk,h2 .hpk{margin-left:-.095em}h1 .hpk.schr,h2 .hpk.schr{margin-left:-.065em}   /* Punkt am Zeilenende (h1 + seit 18.11. alle h2): „.“ hat links 0,12 em Luft -> wie ein Buchstabenabstand (punkt_eng/h2_punkte) */
.hero .lead{max-width:30em;margin:24px auto 0;color:var(--lead);font-size:clamp(17px,1.6vw,20px);line-height:1.5;text-wrap:balance}
.hero .knoepfe{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:40px}
.hero .btn,.hero .btn2{height:50px;min-height:0;padding:0 24px;border-radius:12px;font-size:15.5px;font-weight:600}
.hero .btn{background:linear-gradient(180deg,#DA2E44,#C42539);border-color:#B92236;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 1px 2px rgba(0,0,0,.22),0 8px 20px -10px rgba(0,0,0,.55)}
.hero .btn:hover{background:linear-gradient(180deg,#CC2A3F,#B42034);border-color:#A81E31}
.hero .btn2{border-color:var(--line3);background:transparent}
.hero .btn2:hover{background:var(--hover);border-color:var(--line4)}
.hero .btn:focus-visible,.hero .btn2:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:12px}
/* Vertrauenszeile: je Punkt ein kleines Häkchen davor statt „·“ dazwischen -> beim Umbruch am Handy steht nie ein Trenner
   am Zeilenanfang/-ende */
.hero .einl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 24px;list-style:none;margin:24px 0 0;padding:0;font-size:14px;line-height:20px;color:var(--muted)}
.hero .einl li{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hero .einl svg{width:14px;height:14px;flex:none;opacity:.85}
.js .hero .text{animation:heroein .6s cubic-bezier(0,0,.2,1) both}
@keyframes heroein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.buehne{position:relative;margin:64px auto 0;max-width:1120px;display:flex;align-items:center;justify-content:center;gap:clamp(32px,4vw,56px);text-align:left}
.sf-w{position:relative;flex:0 1 760px;min-width:0}
.ip-w{position:relative;flex:none}
@media (max-width:600px){.hero{padding:56px 0 24px}.hero .kicker{margin-bottom:16px}.hero .lead{margin-top:16px}
 .hero .knoepfe{flex-direction:column;align-items:stretch;max-width:340px;margin:32px auto 0}.hero .btn,.hero .btn2{height:48px}
 .hero .einl{margin-top:16px}.buehne{margin-top:48px}}
/* Variante A „Apple“: sehr große h1, Zeile 1 voll, Zeilen 2–3 in Grau-Abstufung (Kontrast ≥ 3:1 für große Schrift, Test misst) */
.hv-a h1{font-size:clamp(34px,9.4vw,88px);line-height:1.04;letter-spacing:-.03em}
.hv-a h1 .z2{color:#A1A1A6}.hv-a h1 .z3{color:#7C7C82}
@media (prefers-color-scheme:light){.hv-a h1 .z2{color:#6E6E73}.hv-a h1 .z3{color:#86868B}}
/* Studio-Fenster (Stufe 2, 18.11., Zusatz 8): EIN Rahmen, Kopf = Logo + Reiter (echte Knöpfe, ≥ 44 px), darunter je Reiter
   höchstens 3 gleich hohe Zeilen + EIN Satz. Alle Reiter-Inhalte in EINER Rasterzelle übereinander -> feste Höhe (die des
   größten), beim Wechsel springt nichts; Wechsel = nur Deckkraft. Schmale Fenster (Container-Abfrage): erst Wortmarke weg,
   dann Logo weg und Reiter über die ganze Breite. */
.sf{container-type:inline-size;position:relative;border-radius:18px;border:1px solid var(--line2);overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.sf-kopf{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bar)}
.sf-mk{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.sf-mk img{width:30px;height:30px;border-radius:7px}
.sf-mk b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sf-mk b i{font-style:normal;color:var(--red)}
.sf-tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--seg-schiene)}
.sf-t{appearance:none;border:0;margin:0;font:inherit;font-size:14px;font-weight:600;line-height:1;height:44px;padding:0 14px;border-radius:9px;
 background:transparent;color:var(--seg-aus);cursor:pointer;white-space:nowrap;transition:background .3s,color .3s,box-shadow .3s}
.sf-t:hover{color:var(--text)}
.sf-t[aria-selected=true]{background:var(--seg-pille);box-shadow:var(--seg-schatten);color:var(--text)}
.sf-t:focus-visible{outline:2px solid var(--red2);outline-offset:-2px;border-radius:9px}
.sf-inh{display:grid;padding:6px 20px 18px}
.sf-p{grid-area:1/1;min-width:0;visibility:hidden;opacity:0;transition:opacity .35s ease,visibility 0s linear .35s}
.sf-p.an{visibility:visible;opacity:1;transition:opacity .35s ease}
.sf-z{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;height:72px;padding:0 2px}
.sf-z+.sf-z{border-top:1px solid var(--line)}
.sf-th{display:block;justify-self:center;width:32px;height:56px;border-radius:6px;overflow:hidden;background:var(--chip)}
.sf-th img{width:100%;height:100%;object-fit:cover}
.sf-th.sf-vid,.sf-th.sf-pr{display:grid;place-items:center;width:44px;height:44px;border-radius:11px;color:var(--soft);background:var(--inner);box-shadow:inset 0 0 0 1px var(--line)}
.sf-th.sf-vid .ni,.sf-th.sf-pr svg{width:22px;height:22px}
.sf-tx{min-width:0}
.sf-tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-tx small{display:block;margin-top:3px;font-size:13px;line-height:1.3;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-re{display:flex;justify-content:flex-end}
.sf-senden{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;background:var(--red);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.sf-senden svg{width:14px;height:14px}
.sf-satz{margin:10px 2px 0;font-size:14px;line-height:1.45;color:var(--muted);text-wrap:pretty}
@container (max-width:560px){.sf-mk b{display:none}}
@container (max-width:440px){.sf-mk{display:none}.sf-kopf{padding:8px}.sf-tabs{flex:1}.sf-t{flex:1 1 auto;padding:0 6px}
 .sf-inh{padding:4px 12px 14px}.sf-z{grid-template-columns:36px minmax(0,1fr) auto;gap:10px;height:66px}.sf-th.sf-vid,.sf-th.sf-pr{width:36px;height:36px;border-radius:9px}
 .sf-th{width:28px;height:50px}.sf-senden span:not([data-lang]){display:none}.sf-senden{width:32px;padding:0;justify-content:center}}
/* Trend-Chip wie im Studio (Seite „Produkte“): grün = steigt, grau = fällt, blau = neu */
.tchip{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:24px;padding:0 7px;border-radius:7px;font-size:12.5px;font-weight:700;
 background:var(--okbg);color:var(--ok);white-space:nowrap;font-variant-numeric:tabular-nums}
.tchip.ab{background:var(--chip);color:var(--muted)}
.tchip.neu{background:rgba(91,155,255,.14);color:var(--in-fg)}
/* Status-Pille wie im Studio: Umriss + farbiger Punkt */
.pill{display:inline-flex;align-items:center;gap:.5em;font-size:12px;font-weight:600;padding:.33em .83em;border-radius:.67em;border:1px solid var(--line2);color:var(--soft);white-space:nowrap;justify-self:start}
.pill::before{content:"";width:.5em;height:.5em;border-radius:50%;flex:none;background:var(--dot,var(--dim))}
.pill.neu{--dot:#5B9BFF}.pill.ok{--dot:var(--ok)}.pill.inbox{--dot:#6F94E0}.pill.geplant{--dot:#A78BFA}.pill.frei{--dot:#3DB884}

/* Nachbildung eines iPhone 16 Pro (Nutzer 17.11.: „muss wirklich wie ein echtes Apple-iPhone sein“).
   1em = 1 % der Gerätebreite (--w). Gehäuse 71,5 × 149,6 mm, Bildschirm 9:19,5, Titanrahmen mit feiner Kante, schmaler
   schwarzer Rand, Dynamic Island, Seitentasten (links Aktionstaste + Lautstärke, rechts Seitentaste + Kamerasteuerung),
   weicher Schatten. Inhalt seit 18.11. = Produkt-Slideshow (.tts, siehe unten) + iOS-Mitteilung, kein Standbild aus Videos. */
.iphone{--w:260px;position:relative;width:var(--w);aspect-ratio:715/1496;font-size:calc(var(--w) / 100);flex:none;text-align:left;
 border-radius:16.4em;padding:1.05em;
 background:linear-gradient(135deg,#8E8E93 0%,#4A4A4F 18%,#2C2C2F 50%,#4A4A4F 82%,#8E8E93 100%);
 box-shadow:inset 0 0 0 .22em rgba(255,255,255,.22),inset 0 0 .5em rgba(0,0,0,.55),
  0 3.2em 6em -2.6em rgba(0,0,0,.45),0 1.2em 2.4em -1.2em rgba(0,0,0,.28)}
.iphone::before{content:"";position:absolute;inset:.42em;border-radius:16em;box-shadow:inset 0 0 0 .14em rgba(0,0,0,.65);pointer-events:none}
.iphone .tk{position:absolute;width:.75em;border-radius:.4em;background:linear-gradient(90deg,#2C2C2F,#7C7C82 45%,#3A3A3D)}
.iphone .tk.l{left:-.62em}.iphone .tk.r{right:-.62em}
.iphone .tk.a{top:17.5%;height:5.6%}.iphone .tk.v1{top:26.5%;height:10.4%}.iphone .tk.v2{top:39.5%;height:10.4%}
.iphone .tk.s{top:29%;height:15.5%}.iphone .tk.k{top:59%;height:9.6%;width:.5em;right:-.4em;border-radius:.3em}
.iphone .rd{position:relative;height:100%;border-radius:15.4em;background:#000;padding:2.35em}
.iphone .bs{position:relative;height:100%;border-radius:13.2em;overflow:hidden;background:#000;isolation:isolate}
.iphone .bs>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Hero-iPhone = TikTok-Foto-Ansicht (Mikail 18.11.: kein Bild/Video von ihm): 9:16-Box unten im 9:19,5-Bildschirm (oben schwarz
   wie in der App, dort liegen Statusleiste und Mitteilung), 4 Folien seiner Slideshows, Wechsel alle 2,2 s mit weichem Wischen
   (nur transform, kein Layout). Fortschritts-Striche oben in der Box, dezent. Ohne JS / „Weniger Bewegung“: Folie 1 steht still.
   Zustände: ohne Klasse = rechts wartend (Sprung ohne Übergang), .an = sichtbar, .weg = nach links hinaus.
   Je Folie ein .fo mit zwei Bildern (data-lang de/en, die andere Sprache blendet die globale Sprach-Regel aus). */
.iphone .tts{position:absolute;left:0;right:0;bottom:0;aspect-ratio:9/16;overflow:hidden;background:#000}
.iphone .tts .fo{position:absolute;inset:0;transform:translateX(100%)}
.iphone .tts .fo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.iphone .tts .fo.an{transform:none;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.iphone .tts .fo.weg{transform:translateX(-100%);transition:transform .7s cubic-bezier(.3,.7,.2,1)}
html:not(.js) .iphone .tts .fo:not(:first-child){display:none}
.iphone .tts .fs{position:absolute;left:4em;right:4em;top:6em;display:flex;gap:1.2em;z-index:1}
.iphone .tts .fs i{flex:1;height:.55em;border-radius:1em;background:rgba(255,255,255,.32)}
.iphone .tts .fs i.an{background:rgba(255,255,255,.9);transition:background .4s}
.iphone .insel{position:absolute;top:2.5em;left:50%;width:30.5em;height:8.6em;margin-left:-15.25em;border-radius:5em;background:#000;z-index:3}
.iphone .sb{position:absolute;top:2.6em;left:0;right:0;height:8.4em;display:flex;align-items:center;justify-content:space-between;
 padding:0 8.2em 0 10.6em;color:#fff;z-index:2}
.iphone .sb b{font-size:4.25em;font-weight:600;letter-spacing:-.01em;line-height:1;font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans',system-ui,sans-serif}
.iphone .sb svg{height:3.6em;width:auto}
.iphone .mt{position:absolute;left:3.4em;right:3.4em;top:15em;z-index:4;display:flex;align-items:center;gap:3.2em;padding:3.2em 4em 3.4em 3.4em;
 border-radius:7.4em;background:rgba(246,246,248,.80);-webkit-backdrop-filter:blur(1.6em) saturate(1.6);backdrop-filter:blur(1.6em) saturate(1.6);
 color:#000;box-shadow:0 .8em 2.4em -.8em rgba(0,0,0,.3);font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans',system-ui,sans-serif}
.iphone .mt img{flex:none;width:12.6em;height:12.6em;border-radius:2.9em}
.iphone .mt>span{flex:1;min-width:0}
.iphone .mt .k{display:flex;justify-content:space-between;gap:2em;font-size:4.1em;line-height:1.25}
.iphone .mt .k b{font-weight:600}
.iphone .mt .k small{font-size:.9em;color:rgba(60,60,67,.62);white-space:nowrap}
.iphone .mt .t{display:block;margin-top:.3em;font-size:4.1em;line-height:1.25;color:#000}
.iphone .home{position:absolute;left:50%;bottom:2em;width:36em;height:1.35em;margin-left:-18em;border-radius:1em;background:rgba(255,255,255,.92);z-index:2}
/* Hero-iPhone „Beides abwechselnd“ (Mikail 18.11. ~12:35): vor der Slideshow die Handy-Ansicht des STUDIOS (.sv, Nachbildung
   mit Beispieldaten, Farben der Seite hell/dunkel): Ordner „Bereit“, „Produkt 1 · Slideshow“, große Vorschau, roter Knopf „An
   TikTok senden“, unten die Reiter-Leiste wie im Studio am Handy. Abfolge per Skript über data-ph am Bildschirm (.bs):
   studio -> druck (Knopf gedrückt) -> gesendet (Knopf „Gesendet“, Mitteilung kommt, data-mt) -> tts (Studio blendet aus, die
   Slideshow läuft in TikTok) -> studio … Nur mit Klasse .bew (JS + keine „Weniger Bewegung“); ohne = Standbild Folie 1 + Mitteilung. */
.iphone .sv{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;padding:15em 5.5em 0;background:var(--bg);color:var(--text);
 font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.3;transition:opacity .6s ease}
.bew .iphone .bs[data-ph] .sv{display:flex}
.iphone .sv-k{display:flex;align-items:center;gap:1.2em;height:11em}
.iphone .sv-zu svg{width:6.4em;height:6.4em;transform:rotate(90deg);color:var(--redt)}
.iphone .sv-k b{font-size:7.4em;font-weight:800;letter-spacing:-.02em}
.iphone .sv-t{margin:2.6em 0 0}
.iphone .sv-t b{display:block;font-size:5.4em;font-weight:700}
.iphone .sv-t small{display:block;margin-top:.25em;font-size:4.2em;color:var(--muted)}
.iphone .sv-b{position:relative;width:74em;aspect-ratio:3/4;margin:4.6em auto 0;border-radius:4.4em;overflow:hidden;background:#000;box-shadow:0 2em 5em -2.4em rgba(0,0,0,.45)}
.iphone .sv-b img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.iphone .sv-knopf{display:grid;margin:5.6em 0 0;height:15em;border-radius:4.4em;background:var(--red);color:#fff;transition:transform .2s ease,background .3s ease,color .3s ease}
.iphone .sv-knopf>span{grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:.45em;font-size:4.6em;font-weight:650;transition:opacity .25s}
.iphone .sv-knopf svg{width:1.05em;height:1.05em}
.iphone .sv-g{opacity:0}
.iphone .sv-g svg{color:var(--ok)}
.iphone .sv-nav{display:flex;justify-content:space-around;margin:auto -5.5em 0;padding:3.4em 3em 9.5em;border-top:1px solid var(--line);background:var(--bar)}
.iphone .sv-nav i{display:grid;place-items:center;color:var(--dim)}
.iphone .sv-nav i.an{color:var(--redt)}
.iphone .sv-nav .ni{width:9em;height:9em}
.bew .iphone .bs[data-ph=druck] .sv-knopf{transform:scale(.95);background:var(--btnh)}
.bew .iphone .bs[data-ph=gesendet] .sv-knopf,.bew .iphone .bs[data-ph=tts] .sv-knopf{background:var(--chip);color:var(--text)}
.bew .iphone .bs[data-ph=gesendet] .sv-a,.bew .iphone .bs[data-ph=tts] .sv-a{opacity:0}
.bew .iphone .bs[data-ph=gesendet] .sv-g,.bew .iphone .bs[data-ph=tts] .sv-g{opacity:1}
.bew .iphone .bs[data-ph=tts] .sv{opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.bew .iphone .bs[data-ph]:not([data-ph=tts]) .sb{color:var(--text)}
.bew .iphone .bs[data-ph]:not([data-ph=tts]) .home{background:var(--text)}
.iphone .sb,.iphone .home{transition:color .4s,background .4s}
.bew .iphone .bs[data-ph] .mt{opacity:0;transform:translateY(-125%);transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .35s ease}
.bew .iphone .bs[data-ph][data-mt] .mt{opacity:1;transform:none}
.iphone .tts.still .fo{transition:none!important}
@media (prefers-reduced-motion:reduce){.bew .iphone .bs[data-ph] .sv{display:none}.bew .iphone .bs[data-ph] .mt{opacity:1;transform:none}}
.buehne .iphone{--w:clamp(188px,17vw,240px)}
@media (max-width:760px){.buehne{flex-direction:column;gap:40px}.ip-w{order:-1}.sf-w{flex:none;width:100%}.buehne .iphone{--w:min(68vw,272px)}}
/* Hero-iPhone „gekippt → gerade“ (Partner 2, 17.11.; seit 18.11. kräftiger, Partner 2 Nachtrag c): oben nach hinten gekippt
   (24°, 5 %, −7 %), richtet sich STUFENLOS mit dem Scrollweg auf (Skript setzt --kp 0..1, Klasse .kipp nur solange nicht gerade).
   Das Studio-Fenster hebt sich am Desktop im selben Takt leicht an (28 px, −2,5 %). Nur transform (kein Layout, Nachbarn bleiben
   stehen); Endlage = Klasse weg = transform none. Ohne JS (.js fehlt) und bei „Weniger Bewegung“: gerade. */
.js .buehne .iphone.kipp{transform-origin:50% 100%;will-change:transform;
 transform:perspective(1500px) translate3d(0,calc((1 - var(--kp,0)) * 5%),0) rotateX(calc((1 - var(--kp,0)) * 24deg)) scale(calc(1 - (1 - var(--kp,0)) * .07))}
@media (min-width:761px){.js .buehne .sf.kipp{transform-origin:50% 100%;will-change:transform;
 transform:translate3d(0,calc((1 - var(--kp,0)) * 28px),0) scale(calc(1 - (1 - var(--kp,0)) * .025))}}
/* Handy (Fable 18.11.): gekippt sinkt die Oberkante (Drehung um die Unterkante + Verkleinerung) -> sonst Loch unter der
   Vertrauenszeile. Gekippt darum um denselben Betrag anheben (nur transform): Oberkante bleibt ruhig ~48–64 px unter der
   Zeile, beim Aufrichten wächst das iPhone nach unten. Endlage gleich. */
@media (max-width:760px){.js .buehne .iphone.kipp{
 transform:perspective(1500px) translate3d(0,calc((1 - var(--kp,0)) * -25%),0) rotateX(calc((1 - var(--kp,0)) * 24deg)) scale(calc(1 - (1 - var(--kp,0)) * .07))}}
@media (prefers-reduced-motion:reduce){.js .buehne .iphone.kipp,.js .buehne .sf.kipp{transform:none;will-change:auto}}
/* Kreide-Pfeile (Partner 2, 17.11.: „Pfeil mit ‚Studio‘ dahin, wie auf einer Tafel“; 18.11. Nachtrag b: zweiter Pfeil „Handy · per
   Web-App“ aufs iPhone, ab 1280 px): handgezeichnete SVG-Striche (Wort als Pfad, keine Web-Schrift) mit leicht rauem Kreide-Rand
   (feTurbulence + feDisplacementMap). Gedämpfte Farbe, nur Deko (aria-hidden, keine Klicks). „Studio“: breit links neben dem
   Fenster, mittel über seiner linken oberen Ecke. „Handy“: rechts neben dem iPhone, ab 1280 px (vorher kein Platz).
   ≤ 760 px keine Pfeile. */
.kreide{position:absolute;z-index:1;width:150px;height:auto;color:var(--muted);pointer-events:none;overflow:visible}
.kreide path{fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:1560px){.sf-w>.kreide{right:calc(100% + 8px);top:4%}}
@media (max-width:1559px){.sf-w>.kreide{left:6px;bottom:calc(100% + 2px);width:128px}}
.kreide.kh{display:none;left:calc(100% + 6px);top:16%;width:146px}
.kreide.kh path{stroke-width:2.6}
/* „Handy“ ab 1280 px (Auflage Fable 18.11.: so früh wie es nichts überdeckt; gemessen: bei 146 px Breite reicht der Platz ab
   1366, schmaler 112 px ab 1280 – 12 px Rand; darunter läge er außerhalb des Bildschirms) */
@media (min-width:1280px){.kreide.kh{display:block}}
@media (min-width:1280px) and (max-width:1365px){.kreide.kh{width:112px;left:calc(100% + 2px)}}
@media (max-width:760px){.kreide,.kreide.kh{display:none}}
/* mittlere Breiten: die Vertrauenszeile reicht bis unter den Pfeil „Studio“ -> Bühne tiefer, Pfeil (≈ 87 px hoch) passt in die Lücke */
@media (min-width:761px) and (max-width:1023px){.buehne{margin-top:104px}}

/* Folien: Vorschaubilder (Studio-Nachbildung) und der Vorher-Nachher-Schieberegler (Kommentar-Folie, beide Seiten mit dem
   Kommentar-Zeichner des Programms gezeichnet, tools/website_bilder.py) – nie Original-Vorlagen fremder Creator. */
.folie{position:absolute;inset:0;container-type:inline-size;background:#1C1C1E;overflow:hidden}
.folie>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.folie .pkt{position:absolute;left:0;right:0;top:3.2%;display:flex;gap:2.4%;justify-content:center;padding:0 10%;z-index:1}
.folie .pkt i{flex:1;height:.6cqw;min-height:2px;border-radius:2px;background:rgba(255,255,255,.5)}
.folie .pkt i.an{background:#fff}
/* Werbe-Kennzeichnung wie Creator sie auf die Folie setzen (Nutzer 17.11. ~18:05: „mache auch #ad“): DE #werbung, EN #ad */
.folie .ad{position:absolute;left:5%;bottom:3.5%;z-index:1;font-size:5.4cqw;font-weight:700;color:#fff;letter-spacing:.01em;
 text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.3)}

/* Sanfte Bewegung im Bild (Nutzer 17.11. ~18:05: „mehr Animationen … wie beim Scrollen sich so bewegt im Bild“): langsamer
   Zoom + Schwenk wie im TikTok-Fotomodus, 10 s hin und zurück. Ränder bleiben bedeckt (Verschiebung ≤ (Zoom−1)/2), Rahmen mit
   overflow:hidden; nur mit JS (.js), bei „Weniger Bewegung“ aus (Regel ganz unten). Nur transform -> kein Layout-Springen. */
@keyframes kb{from{transform:translate(-1%,1%) scale(1.05)}to{transform:translate(1.5%,-1.5%) scale(1.12)}}
.js .kb{animation:kb 10s ease-in-out infinite alternate;will-change:transform}

/* Vorher-Nachher-Schieberegler (Nutzer 17.11. 18:24: „vorher/nachher, wo man nach links und rechts ziehen kann, diese Linie“).
   EIN 9:16-Rahmen, beide Ebenen genau übereinander: unten die Vorlage (Vorher), oben der Nachbau, rechts der Linie
   sichtbar (clip-path inset, kein Layout). Linie/Griff per transform (--p = Stellung in %). touch-action:pan-y: senkrechtes
   Wischen scrollt die Seite, Ziehen erst ab klar waagrechter Bewegung (Skript). */
.vgl{display:grid;justify-items:center;gap:12px;width:100%}
/* Seit 18.11. (Mikail, Zusatz 7: „nicht so unnötig groß“): max. 320 px breit (≈ 569 px hoch, Abschnitt passt bei 1440×900 ganz
   auf den Bildschirm), am Handy 78 vw; keine Außenkarte (.k-vgl ohne Rahmen/Fläche), nur der feine Schatten der Folie. */
.vn{--p:50%;position:relative;width:min(320px,78vw);max-width:100%;aspect-ratio:9/16;border-radius:16px;overflow:hidden;touch-action:pan-y;
 -webkit-user-select:none;user-select:none;cursor:ew-resize;box-shadow:0 18px 40px -22px rgba(0,0,0,.5);isolation:isolate;background:#1C1C1E}
.vn .folie{border-radius:inherit}
.vn img{-webkit-user-drag:none;user-drag:none}
.vn-o{clip-path:inset(0 0 0 var(--p))}
.vn-l{position:absolute;top:0;bottom:0;left:0;width:100%;z-index:3;pointer-events:none;transform:translateX(var(--p))}
.vn-l::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 0 10px rgba(0,0,0,.25)}
.vn-g{position:absolute;left:-22px;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:rgba(255,255,255,.96);color:#1D1D1F;
 display:grid;place-items:center;pointer-events:auto;cursor:ew-resize;box-shadow:0 4px 14px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.12);touch-action:pan-y}
.vn-g svg{width:22px;height:22px}
.vn-g:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:50%}
/* Schild „Verschieben“ am Griff: erscheint mit der Hinweis-Bewegung, verschwindet beim Ziehen oder nach ~3 s */
.vn-tipp{position:absolute;left:0;top:calc(50% + 32px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
 font-size:14px;font-weight:600;color:#fff;background:rgba(14,14,16,.78);padding:6px 11px;border-radius:999px;opacity:0;transition:opacity .3s;
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.vn-tipp.an{opacity:1}
/* Karussell (Nutzer 17.11. ~21:10: „links, rechts so Pfeile … mehrere Slideshows vergleichen“): je Paar eine Schicht, nur die
   aktive sichtbar ([hidden] = nicht geladen, loading=lazy); beim Wechsel liegt die neue kurz unsichtbar oben (.lade), bis
   ihre Bilder fertig sind – kein schwarzes Aufblitzen. Helle Folien (TikTok hell): Striche + #werbung dunkel. */
.vn-paar{position:absolute;inset:0}
.vn-paar[hidden]{display:none}
.vn-paar.lade{opacity:0;z-index:1}
.vn-paar[data-modus=hell] .folie{background:#fff}
.vn-paar[data-modus=hell] .pkt i{background:rgba(0,0,0,.18)}
.vn-paar[data-modus=hell] .pkt i.an{background:rgba(0,0,0,.72)}
.vn-paar[data-modus=hell] .ad{color:#161823;text-shadow:none}
/* Markierung „Dein Name + Profilbild“ (Nutzer 17.11. ~21:10): kleine Pille mit Spitze zum Namen des (erfundenen) Creators; Stelle je Paar
   (--mkx/--mky aus website_bilder.py); sichtbar (.an) nur, wenn Name + Profilbild ganz auf der Nachher-Seite liegen. */
.vn-mark{position:absolute;left:calc(var(--mkx) + 7px);top:var(--mky);z-index:2;transform:translateY(-50%);pointer-events:none;
 max-width:calc(100% - var(--mkx) - 11px);width:max-content;font-size:12px;line-height:16px;font-weight:600;letter-spacing:-.005em;padding:3px 7px;border-radius:999px;
 background:#fff;color:#161823;box-shadow:0 2px 8px rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.vn-mark::before{content:"";position:absolute;left:-4px;top:50%;width:8px;height:8px;margin-top:-4px;background:inherit;transform:rotate(45deg);border-radius:1px}
.vn-mark.an{opacity:1}
.vn[data-modus=hell] .vn-mark{background:#161823;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
/* Umschalter-Pille „Vorher | Nachher“ über der Folie (2 echte Knöpfe, setzen die Linie ganz nach rechts bzw. links) und 3 Reiter
   „Foto · Chat · Mitteilung“ (bis 18.11. Kommentar) darunter (role=tab) – beide schlicht, 1 Akzent (aktiver Zustand), Höhe 36 bzw. 44 px. */
.vgl-pille{display:inline-flex;padding:3px;border-radius:999px;background:var(--chip);gap:2px}
.vgl-s{appearance:none;border:0;margin:0;font:inherit;font-size:13px;font-weight:600;line-height:1;padding:0 14px;height:30px;border-radius:999px;
 background:transparent;color:var(--muted);cursor:pointer}
.vgl-s.an{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.vgl-s:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:999px}
@media (pointer:coarse),(max-width:760px){.vgl-s{height:44px;font-size:14px;padding:0 18px}}   /* Handy: Tippziel ≥ 44 px, Text ≥ 14 px */
.vgl-tabs{display:none;gap:4px;justify-content:center}
.js .vgl-tabs{display:flex}
.vgl-t{appearance:none;border:0;margin:0;font:inherit;font-size:14px;font-weight:600;height:44px;padding:0 12px;background:none;color:var(--muted);
 cursor:pointer;position:relative}
.vgl-t::after{content:"";position:absolute;left:12px;right:12px;bottom:8px;height:2px;border-radius:2px;background:transparent}
.vgl-t[aria-selected=true]{color:var(--text)}
.vgl-t[aria-selected=true]::after{background:var(--red)}
.vgl-t:focus-visible{outline:2px solid var(--red2);outline-offset:-4px;border-radius:10px}
/* Bildunterschrift je Paar übereinander (gleiche Höhe = nichts springt beim Wechsel), nur die aktive sichtbar */
.vgl-cap{display:grid}
.vgl-c{grid-area:1/1;visibility:hidden}
.vgl-c.an{visibility:visible}
.vgl figcaption{font-size:14px;color:var(--muted);text-align:center;max-width:min(340px,86vw);text-wrap:balance}

/* Vertrauens-Leiste (Mikail 18.11., WÜNSCHE 4 Punkt 7: „trocken reingeklatscht … soll besonders sein“): KEINE Linien/Trenner,
   je Punkt ein feines Symbol (1,5-px-Strich) in einem weichen Glas-Quadrat 40 px, darunter fette Kurzzeile + ≤ 4 Wörter,
   mittig, viel Luft. Blendet beim ersten Sehen nacheinander ein (je 80 ms später), bei „Weniger Bewegung“ sofort. */
.fakten{padding:96px 0 0}
.fakten ul{list-style:none;margin:0 auto;padding:0;max-width:1040px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px;text-align:center}
.fakten li{display:flex;flex-direction:column;align-items:center}
.fakten .gq{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;margin:0 0 16px;color:var(--text);
 background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.25)}
.fakten .gq svg{width:20px;height:20px}
.fakten b{display:block;color:var(--text);font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
.fakten li>span{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:4px}
.js .fakten li.auf:nth-child(2){transition-delay:80ms}.js .fakten li.auf:nth-child(3){transition-delay:160ms}.js .fakten li.auf:nth-child(4){transition-delay:240ms}
@media (prefers-color-scheme:light){.fakten .gq{background:linear-gradient(180deg,#FFFFFF,#F4F4F7);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(0,0,0,.08),0 4px 12px -6px rgba(0,0,0,.12)}}
@media (max-width:900px){.fakten ul{grid-template-columns:repeat(2,minmax(0,1fr));max-width:560px}}
@media (max-width:600px){.fakten{padding-top:64px}.fakten ul{gap:32px 16px}}

/* Funktions-Reihen */
.reihe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:72px;align-items:center}
.reihe+.reihe{margin-top:140px}
.reihe.um .rt{order:2}
.rt .lead{margin-top:18px}
.punkte{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:12px}
.punkte li{display:flex;gap:12px;align-items:flex-start;font-size:16px;color:var(--soft)}
.punkte li svg{flex:none;width:20px;height:20px;margin-top:2px;color:var(--redt)}
/* Kachel = Ausschnitt aus dem Studio: ruhige Studio-Fläche (17.11.: ohne eigenes Raster/Licht), darin eine Studio-Karte */
.kachel{position:relative;border-radius:24px;padding:44px;overflow:hidden;min-height:440px;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;
 border:1px solid var(--line2);background:var(--inner)}
@media (max-width:900px){.reihe{grid-template-columns:minmax(0,1fr);gap:36px}.reihe.um .rt{order:0}.reihe+.reihe{margin-top:96px}}
@media (max-width:600px){.kachel{padding:24px 16px;min-height:0;border-radius:20px}}

/* Kachel: Vorlage -> Nachbau = Vorher-Nachher-Schieberegler (CSS oben bei .vn) */
.vgl figure{margin:0}
.kachel.k-vgl{border:0;background:none;padding:0;min-height:0;overflow:visible}

/* Kachel ohne eigene Fläche (Zusatz 6, 18.11.: EIN Rahmen – nur die Karte selbst) */
.kachel.k-frei{border:0;background:none;padding:0;min-height:0;overflow:visible}
/* Kachel: Videoschnitt (Zusatz 6): groß „1:42 → 0:38“, EIN schlichter Balken (behalten = rot, geschnitten = blass, Wort darunter),
   eine Zeile mit EINEM Häkchen. Kein Knopf, keine Pille, keine Muster. */
.schnitt{width:100%;max-width:500px;padding:28px 28px 24px}
.schnitt .sz{display:flex;align-items:flex-end;gap:16px;margin:0 0 26px}
.schnitt .sz>span{display:flex;flex-direction:column;font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;color:var(--muted)}
.schnitt .sz>span.f{color:var(--text)}
.schnitt .sz small{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:0;color:var(--dim)}
.schnitt .sz i{font-style:normal;font-size:28px;line-height:1;color:var(--dim);padding:0 0 7px}
.spur{display:flex;gap:3px;height:40px}
.spur i{border-radius:6px}
.spur i.b{background:var(--red)}
.spur i.x{background:var(--chip)}
.spw{position:relative;height:18px;margin-top:8px}
.spw>span{position:absolute;top:0;transform:translateX(-50%);font-size:12.5px;line-height:18px;color:var(--dim);white-space:nowrap}
.schnitt .sl{display:flex;align-items:center;gap:8px;margin:22px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:14.5px;font-weight:600;color:var(--soft)}
.schnitt .sl svg{flex:none;width:18px;height:18px;color:var(--ok)}
@media (max-width:600px){.schnitt{padding:22px 18px 18px}.schnitt .sz>span{font-size:38px}}

/* Kachel: Produkt-Research (Zusatz 4) = Nachbildung der Studio-Seite „Produkte“: Suchfeld + Zeitraum | 4 Zeilen | Beispielwerte +
   Abbild-Knopf. Ablauf (Skript, data-st 0..3) einmal beim Sichtbarwerden; ohne data-st = Endzustand (ohne JS/„Weniger Bewegung“). */
.pr-k{container-type:inline-size;width:100%;max-width:540px;padding:18px 18px 16px;text-align:left}
.pr-l{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.pr-such{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--field);font-size:14px;color:var(--text)}
.pr-such>svg{flex:none;width:16px;height:16px;color:var(--dim)}
.pr-q{white-space:nowrap;overflow:hidden}
.pr-cur{flex:none;width:1.5px;height:18px;margin-left:-6px;background:var(--red);opacity:0}
.pr-zr{flex:none;display:flex;padding:3px;border-radius:10px;background:var(--seg-schiene)}
.pr-zr>span:not([data-lang]){display:grid;place-items:center;height:34px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--seg-aus);white-space:nowrap}
.pr-zr>span.an{background:var(--seg-pille);box-shadow:var(--seg-schatten);color:var(--text)}
.pr-liste{list-style:none;margin:0;padding:0;display:grid;gap:2px;transition:opacity .4s}
.pr-z{display:grid;grid-template-columns:14px 36px minmax(0,1fr) auto 56px;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;transition:background .5s,box-shadow .5s}
.pr-pl{font-size:13px;font-weight:700;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.pr-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--inner);box-shadow:inset 0 0 0 1px var(--line);color:var(--soft)}
.pr-ic svg{width:20px;height:20px}
.pr-n{min-width:0}
.pr-n b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.pr-n small{display:block;margin-top:1px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.pr-u{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.pr-u b{font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.spark{width:52px;height:22px;color:var(--dim)}
.pr-z .tchip{justify-self:end}
.pr-z.top{background:var(--inner);box-shadow:inset 0 0 0 1px var(--line3)}
.pr-z.top .spark{color:var(--ok)}
.pr-f{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 0;padding:12px 2px 0;border-top:1px solid var(--line)}
.pr-bsp{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--dim)}
.pr-bsp::before{content:"i";display:grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1.3px solid currentColor;font-size:10px;font-weight:800;font-style:italic;line-height:1}
.pr-weiter{display:flex;align-items:center;gap:8px}
.pr-pfeil{display:grid;place-items:center;color:var(--redt);transition:opacity .35s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.pr-pfeil svg{width:18px;height:18px}
.pr-knopf{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;background:var(--red);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.pr-knopf svg{width:14px;height:14px}
.pr-k[data-st="0"] .pr-cur{opacity:1}
.pr-k[data-st="0"] .pr-liste{opacity:.35}
.pr-k[data-st="0"] .pr-z.top,.pr-k[data-st="1"] .pr-z.top{background:transparent;box-shadow:none}
.pr-k[data-st="0"] .pr-z.top .spark,.pr-k[data-st="1"] .pr-z.top .spark{color:var(--dim)}
.pr-k[data-st="0"] .pr-pfeil,.pr-k[data-st="1"] .pr-pfeil,.pr-k[data-st="2"] .pr-pfeil{opacity:0;transform:translateX(-40px)}
@keyframes prglow{0%{box-shadow:inset 0 0 0 1px var(--line3),0 0 0 0 rgba(232,52,74,0)}35%{box-shadow:inset 0 0 0 1.5px rgba(232,52,74,.6),0 0 24px 2px rgba(232,52,74,.22)}
 100%{box-shadow:inset 0 0 0 1px var(--line3),0 0 0 0 rgba(232,52,74,0)}}
.pr-k[data-st="2"] .pr-z.top,.pr-k[data-st="3"] .pr-z.top{animation:prglow 1.4s ease-out 1}
@container (max-width:460px){.pr-z{grid-template-columns:32px minmax(0,1fr) auto 52px;gap:8px;padding:8px 6px}.pr-pl,.spark{display:none}.pr-ic{width:32px;height:32px}
 .pr-l{flex-wrap:wrap}.pr-such{flex-basis:100%}.pr-f{flex-wrap:wrap}}

/* Kachel: „Heute geplant“ (Studio-Karte der Übersicht) */
.plan-k{width:100%;max-width:470px;padding:22px}
.plan-k .k{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.plan-k .k b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.slot{display:flex;align-items:center;gap:14px}
.slot+.slot{margin-top:12px}
.slot time{flex:none;width:52px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.slot .box{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:10px;background:var(--inner);border:1px solid var(--line)}
.slot .th{flex:none;width:30px;height:40px;border-radius:6px;object-fit:cover;background:var(--chip)}
.slot .t{flex:1 1 150px;min-width:0}
.slot .t b{display:block;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:break-word}
.slot .t small{display:block;font-size:12px;color:var(--dim);white-space:nowrap}
@media (max-width:600px){.plan-k{padding:16px 12px}.slot{gap:8px}.slot time{width:44px;font-size:14px}.slot .box{padding:9px 10px;gap:10px}.slot .th{display:none}}

/* Kontrolle */
.drei{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:56px}
.karte{padding:30px;border-radius:18px}
.karte p{margin:10px 0 0;color:var(--muted);font-size:16px}
.mitte{text-align:center;max-width:760px;margin:0 auto}
.mitte .lead{max-width:640px;margin-left:auto;margin-right:auto}
@media (max-width:900px){.drei{grid-template-columns:1fr;gap:14px;margin-top:40px}.karte{padding:24px}}

/* Beta-Tester */
.beta{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:center;padding:56px;border-radius:24px}
.beta .lead{margin-top:18px}
.beta .knoepfe{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.zahl{margin:0;display:flex;align-items:baseline;gap:14px}
.zahl b{font-size:clamp(72px,8.5vw,112px);font-weight:700;letter-spacing:-.045em;line-height:.9}
.zahl span:not([data-lang]){font-size:21px;font-weight:700;color:var(--soft);letter-spacing:-.01em}
/* Creator-Chips (Pillen mit Rand, Profilbild links). Nutzer 17.11. ~18:05: jeder Chip = Link zum TikTok-Profil (neuer Tab),
   Tippfläche ≥ 44 px, dezenter Hover/Fokus; „+1“ ohne Link. */
.b-namen{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.b-namen li{display:flex;min-width:0}
.b-namen .bc,.b-namen li.mehr{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:5px 15px 5px 5px;border-radius:999px;border:1px solid var(--line2);
 background:var(--inner);font-size:15px;font-weight:600;line-height:1.2}
.b-namen .bc{text-decoration:none;color:var(--text);transition:border-color .2s,background .2s}
.b-namen .bc:hover{border-color:var(--line4);background:var(--hover)}
.b-namen .bc:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:999px}
.b-namen .bn{min-width:0}
.b-namen .bi{flex:none;width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--muted);overflow:hidden;
 box-shadow:inset 0 0 0 1px var(--line2)}
.b-namen .bi svg{width:17px;height:17px}
.b-namen .bi img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.b-namen li.mehr{color:var(--muted);font-weight:500;background:transparent;border-style:dashed;border-color:var(--line3)}
/* Handy (Nutzer 17.11. ~18:05 „im Stil von davor, aber anders positioniert“): Pillen-Chips in einem Raster mit 2 gleich breiten
   Spalten, alle gleich hoch (Zeilen 1fr), Namen nie abgeschnitten (Umbruch nur an der erlaubten Stelle <wbr>);
   „+2 weitere“ füllt die freie Zelle (2×2) bzw. bei gerader Namenszahl die volle Breite (.voll), mittig, gestrichelt. */
@media (max-width:600px){.b-namen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;margin-top:20px}
 .b-namen .bc,.b-namen li.mehr{width:100%;gap:7px;padding:4px 10px 4px 4px;font-size:14px}
 .b-namen .bc{border-radius:26px}
 .b-namen .bi{width:30px;height:30px}
 .b-namen li.mehr{justify-content:center;padding-right:16px}
 .b-namen li.mehr.voll{grid-column:1/-1}
 .b-namen .bn{white-space:nowrap}}
/* Sehr schmale Handys (< 420 px): eine Spalte ist zu schmal für Bild + längsten Namen in EINER Zeile (Fable 17.11.: „Ein Name
   muss einzeilig bleiben“, Schrift ≥ 14 px) -> Bild über dem Namen, beide mittig; „und 1 weiterer“ genauso. */
@media (max-width:419px){.b-namen .bc,.b-namen li.mehr{flex-direction:column;justify-content:center;gap:6px;padding:10px 8px;border-radius:18px;text-align:center}
 .b-namen .bc:focus-visible{border-radius:18px}
 .b-namen .bi{width:34px;height:34px}}
.beta .leise{margin:14px 0 0}
@media (max-width:900px){.beta{grid-template-columns:minmax(0,1fr);gap:34px;padding:34px}}
@media (max-width:600px){.beta{padding:26px 18px;border-radius:20px}.beta .knoepfe{flex-direction:column;align-items:stretch}}

/* Ablauf */
.ablauf{counter-reset:s;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:56px 0 0;padding:0;list-style:none}
/* Zahl ohne Kreis (Partner 2, 17.11.: „schön in der Ecke, nicht ganz sichtbar … clean, professionell“): groß, oben rechts,
   über den Kartenrand angeschnitten (li overflow hidden), sehr geringer Kontrast (hell/dunkel getrennt), HINTER dem Text
   (eigener Stapelkontext der Karte, Zahl z-index -1 = über dem Kartengrund, unter dem Text). */
.ablauf li{padding:30px 30px 32px;border-radius:18px;overflow:hidden;isolation:isolate;--ziffer:rgba(255,255,255,.075)}
@media (prefers-color-scheme:light){.ablauf li{--ziffer:rgba(0,0,0,.06)}}
/* Zahl ganz IN der Karte (Auflage Fable 18.11.: angeschnitten oben rechts wirkte abgeschnitten), dezent hinter dem Text */
.ablauf li::after{counter-increment:s;content:counter(s);position:absolute;z-index:-1;top:10px;right:18px;font-size:112px;font-weight:800;line-height:1;
 letter-spacing:-.06em;font-variant-numeric:tabular-nums;color:var(--ziffer);pointer-events:none}
.ablauf li h3{margin-top:30px;padding-right:64px}
.ablauf p{margin:10px 0 0;color:var(--muted);font-size:16px}
@media (max-width:900px){.ablauf{grid-template-columns:1fr;gap:14px;margin-top:40px}.ablauf li{padding:24px}
 .ablauf li::after{top:8px;right:14px;font-size:100px}.ablauf li h3{margin-top:24px;padding-right:58px}}
/* Nacheinander einblenden (Stufe 2): nur wenn die drei Karten nebeneinander stehen; untereinander kommt jede beim Scrollen selbst */
@media (min-width:901px){.js .ablauf li.auf:nth-child(2){transition-delay:.1s}.js .ablauf li.auf:nth-child(3){transition-delay:.2s}}

/* Zeitersparnis (Zusatz 10, 18.11.): EINE Karte, je Aufgabe 2 Balken (von Hand = grau, Spanne hell; AutoCutAI = rot), Summe,
   Fußnote mit Quelle. Balken wachsen EINMAL beim Sichtbarwerden (.da vom Einblenden), ohne JS/„Weniger Bewegung“ fertig. */
.zeit{max-width:760px;margin:48px auto 0;padding:28px 32px 26px;text-align:left}
.zt-z+.zt-z{margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}
.zt-n{display:block;margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.zt-b+.zt-b{margin-top:12px}
.zt-b small{display:block;margin-top:5px;font-size:14px;color:var(--muted)}
.zt-bar{position:relative;display:block;height:12px;border-radius:6px;background:var(--inner)}
.zt-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transform-origin:0 50%;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.zt-bar.hand i:first-child{width:calc(var(--b) * 100%);background:var(--line4)}
.zt-bar.hand i+i{width:calc(var(--a) * 100%);background:var(--muted)}
.zt-bar.ac i{width:calc(var(--a) * 100%);background:var(--red);transition-delay:.25s}
.js .zeit:not(.da) .zt-bar i{transform:scaleX(0)}
.zt-summe{margin:24px 0 0;font-size:16px;font-weight:600;line-height:1.5;color:var(--soft);text-wrap:pretty}
.zt-fuss{max-width:760px;margin:16px auto 0;font-size:14px;line-height:1.5;color:var(--dim);text-align:center;text-wrap:pretty}
@media (max-width:600px){.zeit{padding:22px 18px 20px;margin-top:36px}}

/* Preise */
.umschalter{display:inline-grid;grid-auto-flow:column;gap:2px;padding:2px;border-radius:10px;background:var(--seg-schiene);margin-top:30px}
.umschalter button{font-family:inherit;font-weight:600;font-size:14px;line-height:1;color:var(--seg-aus);background:transparent;border:0;padding:0 16px;min-height:44px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.umschalter button[aria-pressed="true"]{background:var(--seg-pille);box-shadow:var(--seg-schatten);color:var(--text)}
.umschalter .spar{font-size:14px;font-weight:700;color:var(--ok);background:var(--okbg);padding:3px 7px;border-radius:6px}
html:not(.js) .umschalter{display:none}
.plaene{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:48px;text-align:left}
.pk{display:grid;grid-template-rows:subgrid;grid-row:span 6;gap:0;border-radius:20px;padding:32px 30px}
/* Komplett „mehr hypen“ (Nutzer 17.11.: „Nicht nur dieser rote Rand, bisschen dicker oder so der Rand. Und mehr Animationen,
   wenn man mit der Maus rübergeht.“): 2-px-Rand (Innenabstand −1 px, damit die Zeilen mit den Nachbarn bündig bleiben),
   roter Schein, kräftiges Abzeichen; Hervorheben/Hover NUR per transform (kein Layout-Sprung), Animationen nur mit Maus
   und ohne „Bewegung reduzieren“. */
.pk{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.pk.hot{border:2px solid rgba(232,52,74,.85);padding:31px 29px;box-shadow:var(--cardsh),0 0 0 4px rgba(232,52,74,.10),0 18px 48px -18px rgba(232,52,74,.55)}
.pk.hot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
 background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%) no-repeat;background-size:260% 100%;background-position:130% 0}
.pk .nm{display:flex;align-items:center;gap:10px}
.pk .badge{font-size:14px;font-weight:700;color:var(--redt);background:var(--redbg);padding:3px 9px;border-radius:7px}
.pk.hot .badge{color:#fff;background:var(--btn);box-shadow:0 4px 14px -4px rgba(232,52,74,.7);padding:4px 11px;letter-spacing:.01em}
@media (min-width:981px){.pk.hot{transform:translateY(-8px)}}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
 .pk:hover{transform:translateY(-6px);border-color:rgba(232,52,74,.45);box-shadow:var(--cardsh),0 22px 44px -20px rgba(0,0,0,.45)}
 .pk.hot:hover{transform:translateY(-12px) scale(1.015);border-color:var(--red2);box-shadow:var(--cardsh),0 0 0 5px rgba(232,52,74,.16),0 26px 60px -18px rgba(232,52,74,.7)}
 .pk.hot:hover::after{opacity:1;animation:pk-glanz 1.6s ease-in-out infinite}
