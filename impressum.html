*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px;background:var(--bg)}
/* Hintergrund wie im Studio: 44-px-Raster mit Ausblend-Maske (Nutzer 16.11.); body als eigener Stapelkontext, damit das
   Raster (::before, z-index -1) über dem Grund und unter dem Inhalt liegt. 17.11. „cleaner“: Licht-Fleck oben entfernt. */
body{margin:0;isolation:isolate;background:var(--bg);
 color:var(--text);overflow-x:hidden;
 font:17px/1.55 'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background-image:linear-gradient(var(--raster) 1px,transparent 1px),linear-gradient(90deg,var(--raster) 1px,transparent 1px);background-size:44px 44px;
 -webkit-mask-image:radial-gradient(ellipse 120% 85% at 50% 0%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 120% 85% at 50% 0%,#000 25%,transparent 80%)}

a{color:inherit}
img,svg{display:block}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--card);color:var(--text);padding:10px 14px;border-radius:10px;border:1px solid var(--line3)}
.skip:focus{top:12px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
@media (max-width:600px){.wrap{padding:0 20px}}

/* Karten wie im Studio (17.11.: ohne Maus-Licht – ruhige Fläche) */
.card{position:relative;background:var(--card);border:1px solid var(--cardline);border-radius:16px;box-shadow:var(--cardsh)}

/* Kopfzeile (wie Studio: Logo + Wortmarke, Reiter-Pille in der Mitte) */
.top{position:sticky;top:0;z-index:50;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.marke{display:flex;align-items:center;gap:11px;min-height:44px;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1}

.marke b{color:var(--red);font-weight:700}
.hnav{display:flex;gap:4px;padding:4px;margin:0 auto;border:1px solid var(--line);border-radius:12px;background:var(--inner)}
.hnav a{font-size:14px;font-weight:500;color:var(--soft);text-decoration:none;padding:8px 14px;border-radius:8px;transition:color .25s,background .25s,box-shadow .25s}
.hnav a:hover{color:var(--text)}
.hnav a.on{color:var(--text);font-weight:600;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line3)}
.hrechts{display:flex;align-items:center;gap:8px;margin-left:auto}

/* Feste Breite (Nutzer 17.11. „beim Sprache wechseln verschiebt sich alles“): beide Sprachen liegen übereinander in EINER
   Rasterzelle, die nicht gewählte nur unsichtbar (visibility, nicht display) -> Breite = längere Sprache, nichts rückt. */
.fest{display:inline-grid;text-align:center}.fest>*{grid-area:1/1;justify-content:center}
html[data-l="de"] .fest>[data-lang="en"],html[data-l="en"] .fest>[data-lang="de"]{display:inline-flex!important;visibility:hidden}
/* Sprache (Nutzer 17.11., 2. Wunsch): KLEINER Knopf = Sprach-Symbol + Flagge + Kürzel (DE/EN), kein Wort. Klick öffnet ein
   kleines Menü (🇩🇪 DE / 🇬🇧 EN, Häkchen an der aktuellen). Ohne Farb-Flaggen (Windows zeigt „DE“/„GB“-Buchstaben) blendet das
   Skript die Flaggen aus (html.ohne-flagge) -> Symbol + Kürzel. */
.langwahl{position:relative}
.lang{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:transparent;
 cursor:pointer;font:inherit;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--soft);transition:color .2s,background .2s,border-color .2s;white-space:nowrap}
.lang:hover,.lang[aria-expanded="true"]{color:var(--text);background:var(--hover);border-color:var(--line3)}
.lang>svg{width:17px;height:17px;flex:none}
.lang .fest>span,.langmenu button{display:inline-flex;align-items:center;gap:5px}

 background:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.14);display:grid;gap:2px}
.langmenu[hidden]{display:none}
.langmenu button{min-height:44px;padding:0 10px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;font-weight:600;
 color:var(--soft);cursor:pointer;gap:8px;text-align:left}
.langmenu button:hover,.langmenu button:focus-visible{background:var(--hover);color:var(--text)}
.langmenu button[aria-current="true"]{color:var(--text)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:600;font-size:15px;line-height:1.1;text-decoration:none;

 transition:background .25s,border-color .25s;white-space:nowrap}

.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;text-decoration:none;color:var(--text);
 padding:13px 22px;border-radius:10px;border:1px solid var(--line3);background:transparent;transition:background .25s,border-color .25s;white-space:nowrap}

.btn.klein{min-height:44px}

/* Typografie */

 font-size:14px;font-weight:600;color:var(--text)}

/* Hero */

/* Nachbildung: Studio-Fenster (Reiter „Videos“, Ansicht Slideshows). Alle Maße in em = Studio-Pixel / 15. */
.fenster{container-type:inline-size;position:relative;border-radius:18px;border:1px solid var(--line2);overflow:hidden;text-align:left;
 background:var(--bg);box-shadow:var(--shadow)}

.app *{line-height:1.3}
.app .ak{display:flex;align-items:center;gap:1.07em;padding:.93em 2.13em;border-bottom:1px solid var(--line);background:var(--bar)}
.app .mk{display:flex;align-items:center;gap:.8em}
.app .mk img{width:2.67em;height:2.67em;border-radius:.6em}

.app .ac .av{width:2em;height:2em;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--muted)}
.app .ac .av svg{width:1.2em;height:1.2em}
.app .ac .pt{width:.53em;height:.53em;border-radius:50%;background:#3DD68C}
.app .ac span{font-size:.87em;font-weight:600}

.app .inh{display:flex;flex-direction:column;gap:1.6em;padding:2.13em 6.13em 2.6em}
.app .hl{display:flex;align-items:flex-end;gap:.8em}
.app .hl h4{margin:0;font-size:2.27em;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.app .hl p{margin:.15em 0 0;font-size:.87em;color:var(--muted)}
.app .nz{display:inline-flex;align-items:center;gap:.6em;height:2.4em;padding:0 .87em;margin-left:auto;border-radius:.67em;border:1px solid var(--line2);background:var(--inner);color:var(--soft)}
.app .nz span{font-size:.87em;font-weight:650;white-space:nowrap}

 -webkit-mask:radial-gradient(circle,transparent .24em,#000 .27em);mask:radial-gradient(circle,transparent .24em,#000 .27em)}
.app .pri{display:inline-flex;align-items:center;gap:.53em;height:2.93em;padding:0 1.33em;border-radius:.6em;background:var(--red);color:#fff}
.app .pri svg{width:1.2em;height:1.2em}

.app .seg3{position:relative;display:grid;grid-template-columns:repeat(3,1fr);width:26em;height:2.4em;padding:.13em;border-radius:.67em;background:var(--seg-schiene)}

.app .kt{display:flex;flex-direction:column;gap:.93em;padding:1.47em;border-radius:1.07em;background:var(--card);border:1px solid var(--cardline);box-shadow:var(--cardsh)}

.ordner3 .o{display:flex;align-items:center;gap:.8em;min-width:0;min-height:4.13em;padding:.67em .93em;border:1px solid var(--line);border-radius:.8em;color:var(--soft)}
.ordner3 .o.an{background:var(--chip);border-color:transparent;box-shadow:inset 0 0 0 1px var(--line3);color:var(--text)}
.ordner3 .oi{flex:none;width:2.4em;height:2.4em;border-radius:.53em;display:grid;place-items:center;background:var(--inner);box-shadow:inset 0 0 0 1px var(--line)}
.ordner3 .o.an .oi{background:var(--card);box-shadow:inset 0 0 0 1px var(--line3)}
.ordner3 .oi svg{width:1.4em;height:1.4em}

.app .kz{display:flex;justify-content:flex-end;gap:.53em}
.app .kz .ab{display:grid;place-items:center;height:2.53em;padding:0 .93em;border-radius:.53em;border:1px solid var(--line3)}
.app .kz .ab span{font-size:.87em;font-weight:600}
.app .kz .su{display:flex;align-items:center;gap:.53em;width:16em;height:2.53em;padding:0 .8em;border-radius:.53em;border:1px solid var(--line2);background:var(--field);color:var(--dim)}
.app .kz .su svg{width:1.07em;height:1.07em}
.app .kz .su span{font-size:.93em}

.app .zl .th{display:block;position:relative;width:3.2em;height:5.67em;border-radius:.53em;overflow:hidden;background:var(--chip)}
.app .zl .th img{width:100%;height:100%;object-fit:cover}

.app .zl .sb svg{width:.93em;height:.93em}
.app .zl .sb span{font-size:.87em;font-weight:600;white-space:nowrap}

/* Status-Pille wie im Studio: Umriss + farbiger Punkt */
.pill{display:inline-flex;align-items:center;gap:.5em;font-size:12px;font-weight:600;padding:.33em .83em;border-radius:.67em;border:1px solid var(--line2);color:var(--soft);white-space:nowrap;justify-self:start}

/* Nachbildung eines iPhone 16 Pro (Nutzer 17.11.: „muss wirklich wie ein echtes Apple-iPhone sein“).

   schwarzer Rand, Dynamic Island, Seitentasten (links Aktionstaste + Lautstärke, rechts Seitentaste + Kamerasteuerung),
   weicher Schatten. Inhalt = echtes Standbild aus SucukFinds' Video + iOS-Mitteilung. */
.iphone{--w:260px;position:relative;width:var(--w);aspect-ratio:715/1496;font-size:calc(var(--w) / 100);flex:none;text-align:left;
 border-radius:16.4em;padding:1.05em;
 background:linear-gradient(135deg,#8E8E93 0%,#4A4A4F 18%,#2C2C2F 50%,#4A4A4F 82%,#8E8E93 100%);

  0 3.2em 6em -2.6em rgba(0,0,0,.45),0 1.2em 2.4em -1.2em rgba(0,0,0,.28)}

.iphone .rd{position:relative;height:100%;border-radius:15.4em;background:#000;padding:2.35em}
.iphone .bs{position:relative;height:100%;border-radius:13.2em;overflow:hidden;background:#1C1C1E;isolation:isolate}
.iphone .bs>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

 padding:0 8.2em 0 10.6em;color:#111;z-index:2}

 border-radius:7.4em;background:rgba(246,246,248,.80);-webkit-backdrop-filter:blur(1.6em) saturate(1.6);backdrop-filter:blur(1.6em) saturate(1.6);
 color:#000;box-shadow:0 .8em 2.4em -.8em rgba(0,0,0,.3);font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans',system-ui,sans-serif}

/* Folien: Vorschaubilder (Studio-Nachbildung) und der Vorher-Nachher-Schieberegler (Kommentar-Folie, beide Seiten mit dem
   Kommentar-Zeichner des Programms gezeichnet, tools/website_bilder.py) – nie Original-Vorlagen fremder Creator. */
.folie{position:absolute;inset:0;container-type:inline-size;background:#1C1C1E;overflow:hidden}
.folie>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.folie .pkt{position:absolute;left:0;right:0;top:3.2%;display:flex;gap:2.4%;justify-content:center;padding:0 10%;z-index:1}
.folie .pkt i{flex:1;height:.6cqw;min-height:2px;border-radius:2px;background:rgba(255,255,255,.5)}
.folie .pkt i.an{background:#fff}
/* Werbe-Kennzeichnung wie Creator sie auf die Folie setzen (Nutzer 17.11. ~18:05: „mache auch #ad“): DE #werbung, EN #ad */
.folie .ad{position:absolute;left:5%;bottom:3.5%;z-index:1;font-size:5.4cqw;font-weight:700;color:#fff;letter-spacing:.01em;
 text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.3)}

/* Sanfte Bewegung im Bild (Nutzer 17.11. ~18:05: „mehr Animationen … wie beim Scrollen sich so bewegt im Bild“): langsamer
   Zoom + Schwenk wie im TikTok-Fotomodus, 10 s hin und zurück. Ränder bleiben bedeckt (Verschiebung ≤ (Zoom−1)/2), Rahmen mit
   overflow:hidden; nur mit JS (.js), bei „Weniger Bewegung“ aus (Regel ganz unten). Nur transform -> kein Layout-Springen. */
@keyframes kb{from{transform:translate(-1%,1%) scale(1.05)}to{transform:translate(1.5%,-1.5%) scale(1.12)}}
.js .kb{animation:kb 10s ease-in-out infinite alternate;will-change:transform}

/* Vorher-Nachher-Schieberegler (Nutzer 17.11. 18:24: „vorher/nachher, wo man nach links und rechts ziehen kann, diese Linie“).
   EIN 9:16-Rahmen, beide Ebenen genau übereinander: unten die Vorlage (Vorher), oben der Nachbau, rechts der Linie
   sichtbar (clip-path inset, kein Layout). Linie/Griff per transform (--p = Stellung in %). touch-action:pan-y: senkrechtes
   Wischen scrollt die Seite, Ziehen erst ab klar waagrechter Bewegung (Skript). */
.vgl{display:grid;justify-items:center;gap:14px;width:100%}
.vn{--p:50%;position:relative;width:300px;max-width:100%;aspect-ratio:9/16;border-radius:16px;overflow:hidden;touch-action:pan-y;
 -webkit-user-select:none;user-select:none;cursor:ew-resize;box-shadow:0 18px 40px -22px rgba(0,0,0,.5);isolation:isolate;background:#1C1C1E}
.vn .folie{border-radius:inherit}
.vn img{-webkit-user-drag:none;user-drag:none}
.vn-o{clip-path:inset(0 0 0 var(--p))}
.vn-l{position:absolute;top:0;bottom:0;left:0;width:100%;z-index:3;pointer-events:none;transform:translateX(var(--p))}
.vn-l::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 0 10px rgba(0,0,0,.25)}
.vn-g{position:absolute;left:-22px;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:rgba(255,255,255,.96);color:#1D1D1F;
 display:grid;place-items:center;pointer-events:auto;cursor:ew-resize;box-shadow:0 4px 14px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.12);touch-action:pan-y}
.vn-g svg{width:22px;height:22px}
.vn-g:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:50%}
/* Schild „Verschieben“ am Griff: erscheint mit der Hinweis-Bewegung, verschwindet beim Ziehen oder nach ~3 s */
.vn-tipp{position:absolute;left:0;top:calc(50% + 32px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
 font-size:14px;font-weight:600;color:#fff;background:rgba(14,14,16,.78);padding:6px 11px;border-radius:999px;opacity:0;transition:opacity .3s;
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.vn-tipp.an{opacity:1}
/* Etiketten oben links/rechts; blenden aus, wenn die Linie nah ist (Klasse .weg vom Skript) */
.vn-et{position:absolute;top:22px;z-index:2;max-width:42%;padding:5px 9px;border-radius:9px;background:rgba(14,14,16,.66);color:#fff;line-height:1.2;
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .2s}
.vn-et.l{left:10px}.vn-et.r{right:10px;text-align:right}
.vn-et b{display:block;font-size:12px;font-weight:700}
.vn-et small{display:block;font-size:11px;font-weight:500;opacity:.85}
.vn-et.weg{opacity:0}
.vgl figcaption{font-size:14px;color:var(--muted);text-align:center;max-width:320px}
.vgl figcaption b{color:var(--text);font-weight:600}

.schnitt{width:100%;max-width:520px;padding:22px}

.spur i.x{background:repeating-linear-gradient(135deg,var(--chip) 0 6px,transparent 6px 11px);border:1px dashed var(--line3)}

.plan-k{width:100%;max-width:470px;padding:22px}

.slot .th{flex:none;width:30px;height:40px;border-radius:6px;object-fit:cover;background:var(--chip)}
.slot .t{flex:1 1 150px;min-width:0}
.slot .t b{display:block;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:break-word}

@media (max-width:600px){.plan-k{padding:16px 12px}.slot{gap:8px}.slot time{width:44px;font-size:14px}.slot .box{padding:9px 10px;gap:10px}.slot .th{display:none}}

/* Kontrolle */
.drei{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:56px}

/* Beta-Tester */
.beta{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:center;padding:56px;border-radius:24px}
.beta .lead{margin-top:18px}

.zahl{margin:0;display:flex;align-items:baseline;gap:14px}

.zahl span{font-size:21px;font-weight:700;color:var(--soft);letter-spacing:-.01em}
/* Creator-Chips (Pillen mit Rand, Profilbild links). Nutzer 17.11. ~18:05: jeder Chip = Link zum TikTok-Profil (neuer Tab),
   Tippfläche ≥ 44 px, dezenter Hover/Fokus; „+1“ ohne Link. */
.b-namen{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.b-namen li{display:flex;min-width:0}
.b-namen .bc,.b-namen li.mehr{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:5px 15px 5px 5px;border-radius:999px;border:1px solid var(--line2);
 background:var(--inner);font-size:15px;font-weight:600;line-height:1.2}
.b-namen .bc{text-decoration:none;color:var(--text);transition:border-color .2s,background .2s}
.b-namen .bc:hover{border-color:var(--line4);background:var(--hover)}
.b-namen .bc:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:999px}
.b-namen .bn{min-width:0}
.b-namen .bi{flex:none;width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--muted);overflow:hidden;
 box-shadow:inset 0 0 0 1px var(--line2)}
.b-namen .bi svg{width:17px;height:17px}
.b-namen .bi img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.b-namen li.mehr{color:var(--muted);font-weight:500;background:transparent;border-style:dashed;border-color:var(--line3)}
.b-namen li.mehr::before{content:attr(data-plus);flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-size:13px;font-weight:600;color:var(--muted)}
/* Handy (Nutzer 17.11. ~18:05 „im Stil von davor, aber anders positioniert“): Pillen-Chips in einem Raster mit 2 gleich breiten
   Spalten, alle gleich hoch (Zeilen 1fr), Namen nie abgeschnitten (Umbruch nur an der erlaubten Stelle <wbr>);
   „+1 und 1 weiterer“ über die volle Breite, mittig, gestrichelt. */
@media (max-width:600px){.b-namen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;margin-top:20px}
 .b-namen .bc,.b-namen li.mehr{width:100%;gap:7px;padding:4px 10px 4px 4px;font-size:14px}
 .b-namen .bc{border-radius:26px}
 .b-namen .bi,.b-namen li.mehr::before{width:30px;height:30px}
 .b-namen li.mehr{grid-column:1/-1;justify-content:center;padding-right:16px}
 .b-namen .bn{white-space:nowrap}}
/* Sehr schmale Handys (< 420 px): eine Spalte ist zu schmal für Bild + längsten Namen in EINER Zeile (Fable 17.11.: „Ein Name
   muss einzeilig bleiben“, Schrift ≥ 14 px) -> Bild über dem Namen, beide mittig; „und 1 weiterer“ genauso. */
@media (max-width:419px){.b-namen .bc,.b-namen li.mehr{flex-direction:column;justify-content:center;gap:6px;padding:10px 8px;border-radius:18px;text-align:center}
 .b-namen .bc:focus-visible{border-radius:18px}
 .b-namen .bi,.b-namen li.mehr::before{width:34px;height:34px}}
.beta .leise{margin:14px 0 0}
@media (max-width:900px){.beta{grid-template-columns:minmax(0,1fr);gap:34px;padding:34px}}
@media (max-width:600px){.beta{padding:26px 18px;border-radius:20px}.beta .knoepfe{flex-direction:column;align-items:stretch}}

/* Ablauf */
.ablauf{counter-reset:s;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:56px 0 0;padding:0;list-style:none}
.ablauf li{padding:30px 30px 32px;border-radius:18px}
.ablauf li::after{counter-increment:s;content:counter(s);position:absolute;top:30px;left:30px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;

.umschalter button[aria-pressed="true"]{background:var(--seg-pille);box-shadow:var(--seg-schatten);color:var(--text)}

.pk{display:grid;grid-template-rows:subgrid;grid-row:span 6;gap:0;border-radius:20px;padding:32px 30px}

.pk .pr .z{font-size:50px;font-weight:800;letter-spacing:-.045em;line-height:1}

/* Probe-Zeit (Nutzer 17.11. ~18:05: „das mittlere Abo, monatlich, 3 Tage kostenlos“) – aus abo_plaene.json probe_tage_monat,
   nur bei „Monatlich“ (.nm-) */
.pk .probe{display:flex;width:fit-content;align-items:center;gap:6px;margin:0 0 8px;padding:5px 10px 5px 8px;border-radius:8px;font-size:14px;font-weight:700;
 color:var(--ok);background:var(--okbg)}
.pk .probe svg{width:16px;height:16px;flex:none}
.pk .ba{margin:26px 0 0;padding-top:22px;border-top:1px solid var(--line);font-size:14px;font-weight:700;color:var(--soft)}
.pk ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px;align-content:start}
.pk ul.lim{margin:22px 0 0}.pk ul.lim li{color:var(--text);font-weight:600}
.pk li{display:flex;gap:10px;font-size:15px;color:var(--soft)}
.pk li svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--redt)}
.preise[data-abr="m"] .nj,.preise[data-abr="j"] .nm-{display:none}
.extra{display:flex;align-items:center;gap:18px;margin-top:20px;padding:22px 26px;border-radius:18px;text-align:left}
.extra b{font-size:16px}
.extra p{margin:2px 0 0;color:var(--muted);font-size:15px}
.extra .ep{margin-left:auto;font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.fussnoten{margin:22px auto 0;max-width:820px;color:var(--dim);font-size:14px;text-align:center}
.fussnoten p{margin:4px 0}
.einladung{display:inline-block;margin-top:18px;font-size:14px;font-weight:600;color:var(--soft);padding:7px 14px;border-radius:10px;background:var(--inner);border:1px solid var(--line2)}
/* EIN Knopf „Für Early Access registrieren“ unter den Plänen (Nutzer 17.11.: kein Anfrage-Knopf mehr je Plan) */
.ea{display:flex;flex-direction:column;align-items:center;gap:12px;margin:40px auto 0;text-align:center}
.ea .leise{margin:0}
@media (max-width:980px){.plaene{grid-template-columns:1fr;max-width:520px;margin-left:auto;margin-right:auto}.pk{grid-row:auto;grid-template-rows:none;display:block}}
@media (max-width:600px){.pk{padding:26px 22px}.pk .pr .z{font-size:44px}.extra{align-items:flex-start;gap:14px;padding:20px}.extra .ep{font-size:20px}
 .einladung{text-align:left}.ea{align-items:stretch;max-width:340px}.ea .btn{white-space:normal}}

/* Vergleich */
.vergleich{margin:32px auto 0;max-width:980px;text-align:left}
.vergleich summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--text);padding:12px}
.vergleich summary::-webkit-details-marker{display:none}
/* Pfeil-Winkel statt Plus (Nutzer 17.11. ~18:05: „statt + … ohne Animation“): zu = nach unten, offen = nach oben, wechselt SOFORT */
.vergleich summary svg{width:16px;height:16px;transition:none}
.vergleich[open] summary svg{transform:rotate(180deg)}
.tab{width:100%;border-collapse:collapse;margin-top:16px;font-size:15px;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--cardline);box-shadow:var(--cardsh)}
.tab th,.tab td{padding:13px 18px;border-bottom:1px solid var(--line);text-align:center}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab thead th{font-size:15px;font-weight:700;padding-top:20px;padding-bottom:16px}
.tab .gr th{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding-top:22px;text-align:left}
.tab td{color:var(--soft)}
.tab td svg{width:18px;height:18px;margin:0 auto}
.tab td .ja{color:var(--redt)}
.tab td .nein{color:var(--dim)}
.tab tr:last-child td{border-bottom:0}
@media (max-width:600px){.tab,.tab tbody,.tab thead{display:block}.tab thead tr,.tab tbody tr{display:grid;grid-template-columns:repeat(3,1fr)}
 .tab thead th:first-child{display:none}.tab tbody td:first-child{grid-column:1/-1;border-bottom:0;padding-bottom:2px}
 .tab .gr th{grid-column:1/-1;font-size:14px}.tab th,.tab td{padding:10px 12px}.tab tbody td:not(:first-child){padding-top:4px}}

/* FAQ */
.faq{max-width:820px;margin:48px auto 0}
.faq details{border-bottom:1px solid var(--line2)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{flex:none;width:20px;height:20px;color:var(--muted);transition:none}
/* offen = nach oben; beim Schließen (.zu, Antwort klappt noch animiert zu) zeigt er sofort wieder nach unten */
.faq details[open]:not(.zu) summary svg{transform:rotate(180deg)}
/* Antwort in .fa: das Skript blendet sie beim Öffnen/Schließen ruhig ein/aus (Höhe + Deckkraft, 280 ms, ease-out; Nutzer 17.11.).
   Ohne JS bzw. bei „Weniger Bewegung“ klappt <details> sofort auf – Tastatur (Tab, Enter/Leertaste) wie gewohnt. */
.faq .fa{overflow:hidden}
.faq details p{margin:-6px 0 22px;color:var(--muted);font-size:16px;max-width:700px}

/* Schluss */
.schluss{text-align:center;padding-bottom:140px}
.schluss .knoepfe{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.schluss .logo{width:72px;height:72px;border-radius:16px;margin:0 auto 26px;box-shadow:0 10px 24px -12px rgba(0,0,0,.35)}
@media (max-width:600px){.schluss{padding-bottom:90px}.schluss .knoepfe{flex-direction:column;align-items:stretch;max-width:340px;margin-left:auto;margin-right:auto}}

/* Early-Access-Formular (Nutzer 17.11. ~18:05): E-Mail + Ankreuzfeld (aus) + Knopf; Fehler inline (aria-live), Erfolg im selben
   Kasten ohne Seitenwechsel. Felder ≥ 16 px Schrift (iOS zoomt sonst), Tippflächen ≥ 44 px. */
.ea-form{max-width:520px;margin:34px auto 0;padding:28px;border-radius:20px;text-align:left}
.ea-form label.ea-l{display:block;font-size:15px;font-weight:600;margin:0 0 8px}
.ea-form input[type=email]{display:block;width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:1px solid var(--line3);background:var(--field);
 color:var(--text);font:inherit;font-size:17px;transition:border-color .2s,box-shadow .2s}
.ea-form input[type=email]::placeholder{color:var(--dim)}
.ea-form input[type=email]:focus{outline:none;border-color:var(--red2);box-shadow:0 0 0 3px var(--redbg)}
.ea-form input[aria-invalid="true"]{border-color:var(--redt)}
.ea-fehler{margin:8px 0 0;min-height:0;font-size:14px;font-weight:600;color:var(--redt)}
.ea-fehler:empty{margin:0}
.ea-check{display:flex;align-items:flex-start;gap:12px;margin:18px 0 0;min-height:44px;padding:8px 0;cursor:pointer;font-size:15px;color:var(--soft);line-height:1.45}
.ea-check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--btn);cursor:pointer}
.ea-form .btn{width:100%;margin-top:18px;white-space:normal}
.ea-form .klein{margin:14px 0 0;font-size:14px;color:var(--dim);text-align:center}
.ea-form .klein a{color:var(--soft);text-decoration:underline;text-underline-offset:3px;display:inline-block;min-height:24px}
.ea-ok{text-align:center;padding:8px 0}
.ea-ok:focus{outline:none}
.ea-ok .haken{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:var(--okbg);color:var(--ok)}
.ea-ok .haken svg{width:28px;height:28px}
.ea-ok h3{font-size:22px}
.ea-ok p{margin:10px 0 0;color:var(--muted);font-size:16px}
.ea-ok .leise{font-size:14px}
.ea-ok a{color:var(--soft)}
.ea-form [hidden]{display:none!important}
.ea-vorschau{margin:0 0 16px;padding:9px 12px;border-radius:10px;border:1px dashed var(--line4);font-size:14px;font-weight:600;color:var(--soft);text-align:center}
@media (max-width:600px){.ea-form{padding:22px 18px;margin-top:28px}}

/* Fußzeile */
.fuss{border-top:1px solid var(--line);background:var(--bar);padding:34px 0 44px;font-size:14px;color:var(--muted)}
.fuss .wrap{display:flex;gap:20px 32px;align-items:center;flex-wrap:wrap}
.fuss nav{display:flex;gap:6px 22px;flex-wrap:wrap;margin-left:auto}
.fuss a{text-decoration:none;color:var(--muted)}
.fuss a:hover{color:var(--text)}
.fuss .marke{color:var(--text)}
.fuss .betr{flex-basis:100%;color:var(--dim);font-size:14px}
.fuss nav a{display:inline-flex;align-items:center;min-height:44px}
@media (max-width:600px){.fuss nav{margin-left:0;flex-basis:100%;gap:0 22px}}

/* Ruhiges Einblenden wie bei Apple (Nutzer 17.11.): Deckkraft 0 -> 1 + 14 px nach oben, 600 ms ease-out, einmal, danach bleibt es.
   Kein Hüpfen, kein Skalieren, keine Unschärfe; je Abschnitt ein Block. Nur mit JS (Klasse .js) – ohne JS ist alles sichtbar.
   Bei „Weniger Bewegung“ gar keine Bewegung und kein Ausblenden. */
.js .auf{opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(0,0,.2,1),transform .6s cubic-bezier(0,0,.2,1)}
.js .auf.da{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}
 .js .auf{opacity:1;transform:none}}

.recht{display:grid;grid-template-columns:190px minmax(0,700px) 210px;gap:56px;justify-content:center;padding-top:72px;padding-bottom:120px}
.rnav,.toc{position:sticky;top:96px;align-self:start}
.rnav p,.toc p{margin:0 0 12px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.rnav ul,.toc ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rnav a{display:block;padding:8px 12px;margin-left:-12px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:15px;transition:color .2s,background .2s}
.rnav a:hover{color:var(--text);background:var(--chip)}
.rnav a[aria-current="page"]{color:var(--text);background:var(--chip);font-weight:600}
.toc{border-left:1px solid var(--line2);padding-left:18px}
.toc a{display:block;padding:5px 0;text-decoration:none;color:var(--muted);font-size:13.5px;line-height:1.4;transition:color .2s}
.toc a:hover,.toc a.an{color:var(--text)}
.toc a.an{font-weight:600}
.tocm{display:none;margin:28px 0 0;border:1px solid var(--line2);border-radius:14px}
.tocm summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:600;font-size:15px}
.tocm summary::-webkit-details-marker{display:none}
.tocm summary svg{width:18px;height:18px;color:var(--muted);transition:none}
.tocm[open] summary svg{transform:rotate(180deg)}
.tocm ul{list-style:none;margin:0;padding:0 16px 14px;display:grid;gap:2px}
.tocm a{display:block;padding:6px 0;text-decoration:none;color:var(--muted);font-size:15px}
.doc{display:flex;flex-direction:column}.doc .panel{display:contents}.doc .items{order:2}.doc .tocm{order:1}
.doc .eyebrow{font-size:14px;font-weight:600;color:var(--redt);letter-spacing:.01em;margin:0 0 14px}
.doc h1{font-size:clamp(36px,5vw,52px);line-height:1.06;margin:0;overflow-wrap:break-word;hyphens:auto}
.doc .sub{margin:14px 0 0;color:var(--muted);font-size:17px}
.doc .item{padding:0;margin-top:44px;scroll-margin-top:88px}
.doc .item+.item{padding-top:36px;border-top:1px solid var(--line)}
.doc .lbl{font-size:21px;font-weight:700;line-height:1.3;letter-spacing:-.015em;margin:0 0 12px;color:var(--text)}
.doc .val{font-size:16.5px;line-height:1.7;color:var(--soft);overflow-wrap:anywhere}
.doc .val p{margin:0 0 12px}.doc .val p:last-child{margin:0}
.doc .val ul{margin:0;padding-left:20px}.doc .val li{margin:6px 0}
.doc .val b{color:var(--text);font-weight:600}
.doc .val .small{font-size:15px;color:var(--muted)}
.doc .val a{color:var(--redt);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.doc .val a:hover{text-decoration-thickness:2px}
@media (max-width:1180px){.recht{grid-template-columns:180px minmax(0,700px);gap:48px}.toc{display:none}.tocm{display:block}}
@media (max-width:860px){.recht{grid-template-columns:minmax(0,1fr);gap:0;padding-top:28px;padding-bottom:80px}
 .rnav{position:static;margin-bottom:36px}.rnav p{display:none}
 .rnav ul{display:flex;gap:6px;flex-wrap:wrap}.rnav a{margin:0;padding:8px 13px;border:1px solid var(--line2);font-size:14px}}
@media (max-width:600px){.doc h1{font-size:30px}.doc .item{margin-top:34px}.doc .item+.item{padding-top:28px}.doc .val{font-size:16px}}
.weiter{min-height:60vh;display:grid;place-items:center;text-align:center;padding:80px 0}
.weiter p{color:var(--muted);margin:14px 0 0}
.weiter a{color:var(--redt)}
